HINT_SECTION_MINISERVER="Weather data can be sent to the Miniserver in several ways. Please choose the method that best suits your configuration. It does NOT make sense to enable more than one method. MQTT is clearly recommended as it is the most stable and reliable method."
HINT_SECTION_SENDWHAT="Only select daily and hourly forecasts if they should be sent to the Miniserver, to keep the load on the Miniserver as low as possible. If you only need current weather data, you should disable forecast transmission."
HINT_SECTION_MQTT="Send weather data via MQTT to the Miniserver. LoxBerry's MQTT gateway is used for this. MQTT is the recommended method for sending weather data to the Miniserver because it is stable and reliable and makes complex parsing of UDP or HTTP inputs in the Miniserver unnecessary. NOTE: A subscription for the topic must be manually configured in the MQTT gateway."
HINT_SECTION_UDP="Send weather data via virtual UDP inputs to the Miniserver. This method requires setting up virtual inputs in the Miniserver and parsing data via logic blocks, which makes the configuration more complex and error-prone. It is recommended to use MQTT instead."
HINT_SECTION_HTTP="Provides weather data via a webpage for the Miniserver that can be queried regularly by the MS (polling). This method also requires setting up virtual HTTP inputs in the Miniserver and parsing data via logic blocks, which makes the configuration more complex and error-prone. It is recommended to use MQTT instead."
HINT_SECTION_CLOUDEMU="The emulator simulates a Loxone weather service server and provides weather data locally. Useful if the official Loxone weather service is unavailable or not wanted. WARNING: the emulator works with the Miniserver Gen. 2 only up to version 15, because Loxone has switched weather data retrieval to HTTPS with certificate verification. See the Loxforum for more information."

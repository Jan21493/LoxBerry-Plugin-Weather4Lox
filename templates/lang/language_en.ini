LABEL_SECTION_STANDARD_WEATHER="Default weather service"
HINT_SECTION_STANDARD_WEATHER="Choose the primary weather service for fetching weather, forecast and current weather data. You need to select and enable a primary weather service to use the plugin. Read the documentation or the hints for the individual weather services to find the right one for your needs. Configure the parameters and API key (if required) further below."
LABEL_SECTION_ALTERNATE_WEATHER="Alternative weather service"
HINT_SECTION_ALTERNATE_WEATHER="Optionally use an alternative weather service for daily and hourly forecasts. This can be useful if your primary weather service provides limited data or a short forecast range. In most cases the primary service should be sufficient. If you want to use alternative services, configure the parameters and API key (if required) further below."
LABEL_SECTION_GENERAL_SETTINGS="General settings"
HINT_SECTION_GENERAL_SETTINGS="Basic settings that are not specific to a weather service. Enter your geo-coordinates, city and country, language and units here, and enable masking of API keys."
LABEL_SECTION_GRABBER="Improve current weather data"
HINT_SECTION_GRABBER="Enable additional grabbers to improve current weather data with a local weather station or your Loxone Miniserver. The current data from a local weather station is usually more accurate and provides extra values, such as solar radiation and UV index. Data from major weather services are typically interpolated for your location based on surrounding weather stations and may not always fit perfectly. The grabbers selected here overwrite current weather data and supplement it with values like solar radiation or UV index. Please note, these settings apply only to current weather data, not to hourly or daily forecasts."
LABEL_SECTION_POLLEN_AIRQUALITY="Pollen forecast and air quality"
HINT_SECTION_POLLEN_AIRQUALITY="Enable pollen and air quality forecast via Open-Meteo and configure your personal allergy sensitivities. Data is provided by Open-Meteo, a free weather service that does not require an API key. Please note that pollen forecasts are only available for certain regions and accuracy may vary depending on location."
HINT_VISUALCROSSING_DESC="Worldwide weather service with forecast data. You need a free API key from the Visual Crossing website (<a href='https://visualcrossing.com/' target='_blank' rel='noopener noreferrer'>visualcrossing.com</a>). Make sure you comply with the Visual Crossing API licence terms, as exceeding usage limits may lead to restrictions. Adjust your query frequency accordingly. Most weather data is only updated hourly, so querying every 30 or 60 minutes is usually sufficient."
HINT_OPENWEATHER_DESC="Global weather service with current data and forecasts. You need a free API key from the OpenWeather website (<a href='https://openweathermap.org/' target='_blank' rel='noopener noreferrer'>openweathermap.org</a>). IMPORTANT: You must provide payment information because the 'One Call 3.0 API' is required. Since the first 1000 API calls per day are free, the service should cost nothing with normal usage (at half-hourly updates only 48 API calls per day are made). Adjust your query frequency accordingly. You can also set limits in your profile."
HINT_WTTRIN_DESC="Free weather service without API key. Supports location queries by city name or coordinates. Please be considerate and do not overdo the requests so the service remains free. Querying every 30 or 60 minutes is usually sufficient since data is not constantly updated."
HINT_WETTERONLINE_DESC="German weather service with detailed forecasts. Since only 48 hours of hourly forecasts are available, missing values are calculated by interpolation from daily forecasts that provide values at 6-hour intervals. No API key required. Note: the API is undocumented and can change at any time."
HINT_WEATHERFLOW_DESC="Weather service for WeatherFlow Tempest stations. API key and station ID required."

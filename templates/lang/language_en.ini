LABEL_SECTION_GRABBER="Improve Current Weather Data"
HINT_SECTION_GRABBER="Enable additional grabbers to improve current weather data with a local weather station or your Loxone Miniserver. The current data from a local weather station is usually more accurate and provides extra values, such as solar radiation and UV index. Data from major weather services are typically interpolated for your location based on surrounding weather stations and may not always fit perfectly. The grabbers selected here overwrite current weather data and supplement it with values like solar radiation or UV index. Please note, these settings apply only to current weather data, not to hourly or daily forecasts."

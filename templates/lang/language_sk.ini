HINT_SECTION_MINISERVER="Údaje o počasí môžu byť na Miniserver odoslané rôznymi spôsobmi. Vyberte metódu, ktorá najlepšie vyhovuje vašej konfigurácii. NEMÁ zmysel aktivovať viac ako jednu metódu. Jasne sa odporúča MQTT ako najstabilnejšia a najspoľahlivejšia metóda."
HINT_SECTION_SENDWHAT="Vyberte denné a hodinové predpovede len vtedy, ak sa majú posielať na Miniserver, aby bola záťaž čo najnižšia. Ak potrebujete len aktuálne dáta, deaktivujte prenos predpovedí."
HINT_SECTION_MQTT="Posielajte údaje cez MQTT na Miniserver. Používa sa MQTT Gateway LoxBerry. MQTT je odporúčaná metóda, pretože je stabilná a spoľahlivá a zbytočný sa stáva zložitý parsing UDP alebo HTTP vstupov v Miniserveri."
HINT_SECTION_UDP="Posielajte údaje cez virtuálne UDP vstupy na Miniserver. Táto metóda vyžaduje nastavenie virtuálnych vstupov v Miniserveri a parsing dát cez logické bloky, čo robí konfiguráciu zložitejšou a náchylnejšou na chyby. Odporúčame namiesto toho použiť MQTT."
HINT_SECTION_HTTP="Poskytujte údaje cez virtuálne HTTP vstupy pre Miniserver. Táto metóda tiež vyžaduje nastavenie virtuálnych HTTP vstupov a parsing dát cez logické bloky, čo robí konfiguráciu zložitejšou a náchylnejšou na chyby. Odporúčame namiesto toho použiť MQTT."
HINT_SECTION_CLOUDEMU="Emulátor simuluje Loxone weather-service server a poskytuje lokálne údaje. Užitočný, ak oficiálna služba Loxone nie je dostupná alebo nie je želaná. POZOR: emulátor funguje s Miniserverom Gen. 2 len do verzie 15, pretože Loxone prešiel na získavanie dát cez HTTPS s overovaním certifikátov. Ďalšie informácie nájdete v Loxforum."

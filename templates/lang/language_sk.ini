BUTTON_TESTWETTERONLINE="Testovať"
HINT_WETTERONLINESTATIONID="Zadajte slug lokality z WetterOnline URL (napr. 'dresden' alebo 'berlin'). Nájdete ho tak, že na wetteronline.de vyhľadáte svoju lokalitu a skopírujete poslednú časť URL, napr. https://www.wetteronline.de/wetter/<b>dresden</b>. Viacslavné názvy sú spojené pomlčkou, napr. 'frankfurt-am-main'. Prehliasovky sú nahradené (ae, oe, ue)."
LABEL_SECTION_STANDARD_WEATHER="Predvolená služba počasia"
HINT_SECTION_STANDARD_WEATHER="Vyberte primárnu službu na získavanie predpovedí a aktuálnych údajov. Na používanie pluginu musíte vybrať a aktivovať primárnu službu. Prečítajte si dokumentáciu alebo tipy k jednotlivým službám. Nižšie nakonfigurujte parametre a príp. API kľúč."
LABEL_SECTION_ALTERNATE_WEATHER="Alternatívna služba počasia"
HINT_SECTION_ALTERNATE_WEATHER="Voliteľne môžete použiť alternatívnu službu pre denné/hodinové predpovede. To môže byť užitočné, ak vaša primárna služba poskytuje obmedzené dáta alebo krátke predpovedné obdobie. Zvyčajne by mala stačiť primárna služba. Ak chcete používať alternatívne služby, nakonfigurujte parametre a príp. API kľúč nižšie."
LABEL_SECTION_GENERAL_SETTINGS="Všeobecné nastavenia"
HINT_SECTION_GENERAL_SETTINGS="Základné nastavenia, ktoré nie sú špecifické pre žiadnu službu počasia. Zadajte tu svoje súradnice, mesto a krajinu, jazyk a jednotky a aktivujte maskovanie API kľúčov."
LABEL_SECTION_GRABBER="Vylepšiť aktuálne údaje"
HINT_SECTION_GRABBER="Povoľte dodatočné grabbery na zlepšenie aktuálnych údajov lokálnou stanicou alebo Miniserverom. Lokálne dáta sú zvyčajne presnejšie a poskytujú ďalšie hodnoty ako slnečné žiarenie a UV index. Dáta z veľkých služieb sa zvyčajne interpolujú z okolitych staníc a nemusia vždy presne sediet. Tu vybrané grabbery prepíšu aktuálne dáta a doplnia ich. Upozorňujeme, že tieto nastavenia platia len pre aktuálne dáta, nie pre hodinové alebo denné predpovede."
LABEL_SECTION_POLLEN_AIRQUALITY="Peľ a kvalita ovzdušia"
HINT_SECTION_POLLEN_AIRQUALITY="Povoľte predpoveď peľu a kvality ovzdušia cez Open-Meteo a nastavte svoje citlivosti. Dáta poskytuje Open-Meteo, bezplatná služba bez API kľúča. Upozorňujeme, že predpoveď peľu je dostupná len pre určité regióny a presnosť sa môže líšiť podľa lokality."
HINT_VISUALCROSSING_DESC="Celosvetová služba s predpovednými dátami. Potrebujete bezplatný API kľúč z webovej stránky Visual Crossing (<a href=\"https://visualcrossing.com/\" target=\"_blank\" rel=\"noopener noreferrer\">visualcrossing.com</a>). Uistite sa, že dodržiavate licenčné podmienky API, pretože prekročenie limitov môže viesť k obmedzeniam. Upravte frekvenciu dopytov. Mnohé dáta sa aktualizujú len každú hodinu, takže dopyt každých 30 alebo 60 minút je zvyčajne dostačujúci."
HINT_OPENWEATHER_DESC="Globálna služba s aktuálnymi dátami a predpoveďami. Potrebujete bezplatný API kľúč z webovej stránky OpenWeather (<a href=\"https://openweathermap.org/\" target=\"_blank\" rel=\"noopener noreferrer\">openweathermap.org</a>). DÔLEŽITÉ: Musíte poskytnúť platobné údaje, pretože sa vyžaduje 'One Call 3.0 API'. Keďže prvých 1000 API volaní za deň je zadarmo, služba by pri bežnom používaní nemala nič stáť (pri polhodinovej aktualizácii sa vykoná len 48 API volaní za deň). Upravte frekvenciu dopytov. Môžete tiež nastaviť limity vo svojom profile."
HINT_WTTRIN_DESC="Bezplatná služba bez API kľúča. Podporuje dotaz podľa názvu mesta alebo súradníc. Buďte prosím ohľaduplní a nepreháňajte to s dopytmi, aby služba zostala bezplatná. Dopyt každých 30 alebo 60 minút je zvyčajne dostačujúci, pretože dáta sa neustále neaktualizujú."
HINT_WETTERONLINE_DESC="Nemecká služba s detailnými predpoveďami. Keďže sú k dispozícii len 48-hodinové hodinové predpovede, chýbajúce hodnoty sa počítajú interpoláciou z denných predpovedí, ktoré poskytujú hodnoty v 6-hodinových intervaloch. API kľúč nie je potrebný. Poznámka: API nie je dokumentované a môže sa kedykoľvek zmeniť."
HINT_WEATHERFLOW_DESC="Služba pre WeatherFlow Tempest stanice. Vyžaduje API kľúč a ID stanice."

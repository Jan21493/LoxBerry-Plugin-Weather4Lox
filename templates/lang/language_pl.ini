HINT_THEME="Wybierz motyw dla strony internetowej. Określa on kolory, układ i elementy interfejsu. Możesz przetestować różne motywy za pomocą podglądu przed ich aktywacją. UWAGA: Niektóre 'klasyczne' motywy mogą odświeżać się tylko w skonfigurowanym interwale."

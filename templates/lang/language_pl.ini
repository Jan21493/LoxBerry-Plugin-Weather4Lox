HINT_LINK="Adres URL prowadzi do strony pogodowej wtyczki. Możesz zapisać go jako link sieciowy w Loxone Config, aby otwierać stronę internetową z wybranym motywem i zestawem ikon bezpośrednio z aplikacji Loxone."
OPTIONS_LINK="opcjonalnie: <i><b>?mode=&lt;light/dark&gt;&amp;iconset=&lt;iconset&gt;&amp;lang=&lt;lang&gt;</b></i>, aby ustawić tryb, zestaw ikon i język strony przez URL.<br><b>UWAGA:</b> działa to tylko z nowymi motywami, nie z 'klasycznymi'! <br>Przykład: <i><b>?mode=dark&amp;iconset=naturalistic&amp;lang=pl</b></i>"
LABEL_THEMELANG="Język dla motywów"

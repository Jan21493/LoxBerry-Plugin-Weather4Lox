HINT_SECTION_WEATHER_OBSERVATIONS="Opcjonalnie możesz dodatkowo korzystać z serwisu pogodowego dla zaobserwowanych pomiarów z minionych godzin i dni. Jest to przydatne na przykład do poprawnego wyświetlania sum opadów z przeszłości. Pomiary son uzupełniane cogodzinnymi danymi historycznymi. Pamiętaj, że każda godzina zużywa oddzielne wywołanie API, co może znacznie wpłynąć na Twój limit API. Włącz tę funkcję tylko wtedy, gdy naprawdę jej potrzebujesz."
LABEL_WEATHER_SERVICE_OBS="Serwis pogodowy dla obserwacji"
HINT_CONFIGURE_WEATHER_SERVICE_OBS="Skonfiguruj wybrany serwis pogodowy poniżej."
LABEL_FETCH_WEATHER_SERVICE_OBS="Dołącz obserwacje z minionych godzin i dni"
HINT_FETCH_WEATHER_SERVICE_OBS="Pamiętaj, że pobieranie obserwacji znacznie wpływa na Twój limit API. Niektóre serwisy pogodowe naliczają 1 wywołanie API za każdą pobraną godzinę, czyli do 192 wywołań API dziennie przez 8 dni. Sprawdź swoją licencję API."
LABEL_FETCH_DATA_OBS="Pobierz historyczne dane pogodowe"
HINT_FREE_ACCOUNT_OBS="<b>OSTRZEŻENIE:</b> Pobieranie obserwacji znacząco wpływa na Twoje konto API. Sprawdź swoją licencję API i nasze Wiki, aby dowiedzieć się, ile darmowych wywołań API jest dostępnych!"
LABEL_SECTION_ALTERNATE_WEATHER="Alternatywny serwis pogodowy"
HINT_SECTION_ALTERNATE_WEATHER="Opcjonalnie użyj alternatywnego serwisu pogodowego dla prognoz dziennych i godzinowych. Może to być przydatne, jeśli Twój główny serwis pogodowy zapewnia ograniczone dane lub krótki zakres prognozy. W większości przypadków główny serwis powinien być wystarczający. Jeśli chcesz korzystać z alternatywnych serwisów, skonfiguruj parametry i klucz API (jeśli jest wymagany) poniżej."
LABEL_SECTION_GENERAL_SETTINGS="Ustawienia ogólne"
HINT_SECTION_GENERAL_SETTINGS="Podstawowe ustawienia, które nie są specyficzne dla danego serwisu pogodowego. Wprowadź tutaj swoje współrzędne geograficzne, miasto i kraj, język oraz jednostki, a także włącz maskowanie kluczy API."
LABEL_SECTION_GRABBER="Ulepsz aktualne dane pogodowe"
HINT_SECTION_GRABBER="Włącz dodatkowe grabbery, aby ulepszyć aktualne dane pogodowe za pomocą lokalnej stacji pogodowej lub Miniservera Loxone. Aktualne dane z lokalnej stacji pogodowej są zazwyczaj dokładniejsze i dostarczają dodatkowych wartości, takich jak promieniowanie słoneczne i indeks UV. Dane z głównych serwisów pogodowych są zazwyczaj interpolowane dla Twojej lokalizacji na podstawie okolicznych stacji pogodowych i nie zawsze muszą idealnie pasować. Wybrane tutaj grabbery nadpisują aktualne dane pogodowe i uzupełniają je o wartości takie jak promieniowanie słoneczne lub indeks UV. Pamiętaj, że te ustawienia dotyczą tylko aktualnych danych pogodowych, a nie prognoz godzinowych lub dziennych. Dane pogodowe z Twojej własnej stacji pogodowej w sieci lokalnej są aktualizowane raz na minutę."
LABEL_SECTION_POLLEN_AIRQUALITY="Prognoza pyłków i jakość powietrza"
HINT_SECTION_POLLEN_AIRQUALITY="Włącz prognozę pyłków i jakości powietrza przez Open-Meteo oraz skonfiguruj swoje osobiste wrażliwości na alergie. Dane są dostarczane przez Open-Meteo, bezpłatny serwis pogodowy, który nie wymaga klucza API. Pamiętaj, że prognozy pyłków są dostępne tylko dla niektórych regionów, a dokładność może się różnić w zależności od lokalizacji."
HINT_VISUALCROSSING_DESC="Globalny serwis pogodowy z danymi prognoz. Potrzebujesz darmowego klucza API ze strony Visual Crossing (<a href='https://visualcrossing.com/' target='_blank' rel='noopener noreferrer'>visualcrossing.com</a>). Upewnij się, że przestrzegasz warunków licencji Visual Crossing API, ponieważ przekroczenie limitów użycia może prowadzić do ograniczeń. Dostosuj odpowiednio częstotliwość zapytań. Większość danych pogodowych jest aktualizowana tylko co godzinę, więc odpytywanie co 30 lub 60 minut jest zazwyczaj wystarczające."
HINT_OPENWEATHER_DESC="Globalny serwis pogodowy z aktualnymi danymi i prognozami. Potrzebujesz darmowego klucza API ze strony OpenWeather (<a href='https://openweathermap.org/' target='_blank' rel='noopener noreferrer'>openweathermap.org</a>). WAŻNE: Musisz podać informacje o płatnościach, ponieważ wymagane jest 'One Call 3.0 API'. Ponieważ pierwsze 1000 wywołań API dziennie jest darmowe, usługa przy normalnym użytkowaniu nie powinna nic kosztować (przy aktualizacjach co pół godziny wykonywanych jest tylko 48 wywołań API dziennie). Dostosuj odpowiednio częstotliwość zapytań. Możesz także ustawić limity w swoim profilu."
HINT_WTTRIN_DESC="Bezpłatny serwis pogodowy bez klucza API. Obsługuje zapytania o lokalizację według nazwy miasta lub współrzędnych. Prosimy o rozwagą i nieprzesadzanie z zapytaniami, aby usługa pozostała darmowa. Odpytywanie co 30 lub 60 minut jest zazwyczaj wystarczające, ponieważ dane nie są stale aktualizowane."
HINT_WETTERONLINE_DESC="Niemiecki serwis pogodowy ze szczegółowymi prognozami. Ponieważ dostępne jest tylko 48 godzin prognoz godzinowych, brakujące wartości są obliczane przez interpolacją z prognoz dziennych, które dostarczają wartości w 6-godzinnych odstępach. Klucz API nie jest wymagany. Uwaga: API jest nieudokumentowane i może ulec zmianie w dowolnym momencie."
HINT_WEATHERFLOW_DESC="Serwis pogodowy dla stacji WeatherFlow Tempest. Wymagany klucz API i ID stacji."

LABEL_POLLEN_SETTINGS="Osobista wrażliwość na pyłki"
HINT_POLLEN_SETTINGS="Wprowadź swoją osobistą wrażliwość dla każdego rodzaju pyłków. Wartości są używane do obliczenia indywidualnego obciążenia wyświetlanego jako miks na stronie internetowej. Skala od 0 (brak) do 7 (bardzo wysoka)."
HINT_POLLEN_LEVEL_0="Brak pyłków w powietrzu."
HINT_POLLEN_LEVEL_1="Pojedyncze pyłki, prawie brak objawów."
HINT_POLLEN_LEVEL_2="Możliwe łagodne objawy."
HINT_POLLEN_LEVEL_3="Objawy występują, pierwsze ograniczenia."
HINT_POLLEN_LEVEL_4="Zauważalne objawy."
HINT_POLLEN_LEVEL_5="Silne dolegliwości (łzawienie oczu, kichanie, astma)."
HINT_POLLEN_LEVEL_6="Bardzo silne dolegliwości."
HINT_POLLEN_LEVEL_7="Maksymalne stężenie pyłków."
HINT_SECTION_MINISERVER="Dane pogodowe można wysyłać do Miniservera na kilka sposobów. Wybierz metodę, która najlepiej pasuje do Twojej konfiguracji. NIE MA sensu włączać więcej niż jednej metody. MQTT jest jednoznacznie zalecane, ponieważ jest to najbardziej stabilna i niezawodna metoda."
HINT_SECTION_SENDWHAT="Wybierz prognozy dzienne i godzinowe tylko wtedy, gdy powinny być wysyłane do Miniservera, aby utrzymać obciążenie Miniservera na jak najniższym poziomie. Jeśli potrzebujesz tylko aktualnych danych pogodowych, wyłącz przesyłanie prognoz."
HINT_SECTION_MQTT="Wyślij dane pogodowe przez MQTT do Miniservera. Służy do tego bramka MQTT LoxBerry. MQTT jest zalecaną metodę wysyłania danych pogodowych do Miniservera, ponieważ jest stabilna i niezawodna oraz eliminuje konieczność skomplikowanego parsowania wejść UDP lub HTTP w Miniserverze. UWAGA: Subskrypcję dla tematu należy ręcznie skonfigurować w bramce MQTT."
HINT_SECTION_UDP="Wyślij dane pogodowe przez wirtualne wejścia UDP do Miniservera. Ta metoda wymaga skonfigurowania wejść wirtualnych w Miniserverze i parsowania danych za pomocą bloków logicznych, co czyni konfigurację bardziej skomplikowaną i podatną na błędy. Zaleca się używanie MQTT zamiast tego."
HINT_SECTION_HTTP="Udostępnia dane pogodowe za pośrednictwem strony internetowej dla Miniservera, która może być regularnie odpytywana przez MS (polling). Ta metoda wymaga również skonfigurowania wirtualnych wejść HTTP w Miniserverze i parsowania danych za pomocą bloków logicznych, co czyni konfigurację bardziej skomplikowaną i podatną na błędy. Zaleca się używanie MQTT zamiast tego."
HINT_SECTION_CLOUDEMU="Emulator symuluje serwer usług pogodowych Loxone i dostarcza dane pogodowe lokalnie. Przydatne, jeśli oficjalny serwis pogodowy Loxone jest niedostępny lub niepożądany. Jeśli nie zainstalowano wtyczki DNSmasq, pakiet DNSmasq zostanie automatycznie zainstalowany po aktywacji emulatora i odinstalowany po dezaktywacji. Jeśli chcesz używać DNSmasq do innych celów, zainstaluj wtyczkę DNSmasq przed aktywację emulatora.<br><br><b>OSTRZEŻENIE:</b> emulator współpracuje z Miniserverem Gen. 2 tylko do wersji 15, ponieważ Loxone przełączyło pobieranie danych pogodowych na HTTPS z weryfikacją certyfikatu. Zobacz Loxforum, aby uzyskać więcej informacji."

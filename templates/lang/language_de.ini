LABEL_WEBSITE="Webseite"
HINT_SECTION_WEBSITE="Konfiguriere das Aussehen der integrierten Webseite mit Wetterdaten (Theme, Iconset und Sprache). Alternativ können bestimmte Einstellungen auch über die URL-Parameter der Webseite angepasst werden, z.B. ?theme=dark oder ?lang=en. Bitte beachte, dass die Spracheinstellung der Webseite unabhängig von der Plugin-Sprache ist. Du kannst also z.B. die Plugin-Sprache auf Deutsch und die Webseite auf Englisch einstellen, wenn Du möchtest."
LABEL_THEME="Theme"
HINT_THEME="Wähle das Theme für die Webseite aus. Dies bestimmt Farben, Layout und Bedienelemente des Webauftritts. Du kannst verschiedene Themes in der Vorschau testen, um das Aussehen vor der Aktivierung zu prüfen. HINWEIS: 'Classic' Themes werden nur im konfigurierten Intervall aktualisiert!"

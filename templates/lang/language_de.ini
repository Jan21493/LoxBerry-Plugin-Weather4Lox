LABEL_POLLEN_SETTINGS="Persönliche Pollen-Empfindlichkeit"
HINT_POLLEN_SETTINGS="Gib Deine persönliche Empfindlichkeit für jede Pollenart an. Der Wert wird zur Berechnung einer individuellen Belastung verwendet und als 'Mix' auf der Webseite angezeigt. Die Belastungsstufen reichen von 0 (keine Belastung) bis 7 (sehr hohe Belastung)."
HINT_POLLEN_LEVEL_0="Keine Pollen in der Luft."
HINT_POLLEN_LEVEL_1="Einzelne Pollen, kaum Symptome."
HINT_POLLEN_LEVEL_2="Leichte Symptome möglich."

LABEL_SECTION_STANDARD_WEATHER="Standard Wetterdienst für aktuelle Wetterdaten und Vorhersagen"
HINT_SECTION_STANDARD_WEATHER="Wähle den primären Wetterdienst für die Abfrage von aktuellen Wetterdaten und Vorhersagen. Um das Plugin zu nutzen, musst Du einen primären Wetterdienst auswählen und aktivieren. Lese die Dokumentation oder die Hinweise zu den jeweiligen Wetterdiensten, um den passenden Dienst für Deine Bedürfnisse zu finden. Weiter unten musst Du die Parameter und ggf. API Schlüssel für den ausgewählten Dienst eingeben."
LABEL_WEATHERSERVICE="Standard Wetterdienst"
HINT_CONFIGURE_WEATHERSERVICE="Bitte konfiguriere den ausgewählten Wetterdienst weiter unten."
LABEL_SECTION_WEATHER_OBSERVATIONS="Wetterdienst für Messwerte der letzten Stunden und Tage"
HINT_SECTION_WEATHER_OBSERVATIONS="Optional kannst Du einen zusätzlich einen Wetterdienst für die Messwerte der letzten Stunden und Tage verwenden. Das ist sinnvoll, um z.B. Niederschlagsmengen oder Temperaturverläufe in Berechnungen auf dem MS zu verwenden. Sofern Du einen Dienst nutzt, musst Du weiter unten die Parameter und ggf. API Schlüssel für den ausgewählten Dienst eingeben. Da der Abruf von Messwerten Deine API Lizenz erheblich belasten kann, solltest Du diesen Dienst nur nutzen, wenn Du diese Daten wirklich benötigst."
LABEL_WEATHER_SERVICE_OBS="Wetterdienst für Messwerte"
HINT_CONFIGURE_WEATHER_SERVICE_OBS="Bitte konfiguriere den ausgewählten Wetterdienst weiter unten."
LABEL_FETCH_WEATHER_SERVICE_OBS="Messwerte der letzten Stunden und Tage einschließen"
HINT_FETCH_WEATHER_SERVICE_OBS="Bitte beachte, dass der Abruf von Messwerten Deine API Lizenz erheblich belastet. Einige Wetterdienste berechnen 1 API Call pro abgerufener Stunde, d.h. 192 API Calls für einen einmaligen Abruf von 8 Tagen."
LABEL_FETCH_DATA_OBS="Vergangene Wetterdaten abrufen"
HINT_FREE_ACCOUNT_OBS="<b>ACHTUNG:</b> Der Abruf von Messwerten belastet Deinen API Account erheblich.Bitte Deine API Lizenz und unser Wiki prüfen, wie viele freie API Calls Dir zur Verfügung stehen! Einige Wetterdienste berechnen 1 API Call pro abgerufener Stunde, d.h. 192 API Calls für einen einmaligen Abruf von 8 Tagen."
LABEL_SECTION_ALTERNATE_WEATHER="Alternativer Wetterdienst für Vorhersagen"
HINT_SECTION_ALTERNATE_WEATHER="Optional kannst Du einen alternativen Wetterdienst für die Tages- und Stundenvorhersage verwenden. Das kann sinnvoll sein, wenn Dein primärer Wetterdienst keine oder nur eingeschränkte Daten liefert oder der Zeitraum kurz ist. Im Normalfall sollte Dir der primäre Dienst ausreichen. Wenn Du einen alternativen Dienst nutzt, musst Du weiter unten die Parameter und ggf. API Schlüssel für den alternativen Dienst eingeben."
LABEL_USEALTERNATEDFC="Alternativer Wetterdienst für Tagesvorhersage"
LABEL_SECTION_GENERAL_SETTINGS="Allgemeine Einstellungen"
HINT_SECTION_GENERAL_SETTINGS="Grundlegende Einstellungen die nicht spezifisch für einen Wetterdienst sind. Gib hier Deine Geo-Koordinaten, Stadt und Land, Sprache und Einheiten an und aktiviere die Maskierung von API-Schlüsseln."
LABEL_SECTION_GRABBER="Lokale / eigene Wetterstationen einbinden"
HINT_SECTION_GRABBER="Aktiviere zusätzliche Grabber, um die aktuellen Wetterdaten durch eine lokale Wetterstation oder Deinen Loxone Miniserver zu verbessern. Die aktuellen Daten einer lokalen Wetterstation sind i.d.R. genauer und liefern weitere Daten, wie z.B. Solarstrahlung und UV-Index. Die Daten der großen Wetterdienste werden i.d.R. für Deinen Standort anhand von Wetterstationen in der Umgebung interpoliert und passen daher nicht immer. Die hier ausgewählten Grabber überschreiben die aktuellen Wetterdaten und ergänzen diese z.B. mit Solarstrahlung, UV-Index. Bitte beachte, dass diese Einstellungen nur für die aktuellen Wetterdaten gelten und nicht für stündliche oder tägliche Vorhersagen."
LABEL_SECTION_POLLEN_AIRQUALITY="Pollenflugvorhersage und Luftqualität"
HINT_SECTION_POLLEN_AIRQUALITY="Aktiviere die Pollenflug- und Luftqualitätsvorhersage über Open-Meteo und konfiguriere Deine persönlichen Allergie-Empfindlichkeiten. Die Daten werden von Open-Meteo bereitgestellt, einem kostenlosen Wetterdienst, der keine API-Schlüssel benötigt. Bitte beachte, dass die Pollenflugvorhersage nur für bestimmte Regionen verfügbar ist und die Genauigkeit je nach Standort variieren kann."
HINT_VISUALCROSSING_DESC="Weltweiter Wetterdienst mit Vorhersagedaten. Du benötigst einen kostenlosen API-Key, den Du auf der Webseite von Visual Crossing (<a href='https://visualcrossing.com/' target='_blank' rel='noopener noreferrer'>visualcrossing.com</a>) erhalten kannst. Achte darauf, dass Du die API Lizenzbedingungen von Visual Crossing einhältst, da eine Überschreitung der Nutzungslimits zu Einschränkungen führen kann. Passe die Abfragehäufigkeit entsprechend an. Viele Wetterdaten werden nur stündlich aktualisiert, daher ist eine Abfrage alle 30 oder 60 Minuten in der Regel ausreichend."
HINT_OPENWEATHER_DESC="Globaler Wetterdienst mit aktuellen Daten und Vorhersagen. Du benötigst einen kostenlosen API-Key, den Du auf der Webseite von OpenWeather (<a href='https://openweathermap.org/' target='_blank' rel='noopener noreferrer'>openweathermap.org</a>) erhalten kannst. WICHTIG: Du musst Zahlungsinformationen hinterlegen, da die 'One Call 3.0 API' benötigt wird. Da die ersten 1000 API Abfragen pro Tag kostenlos sind, sollte der Dienst bei normaler Nutzung nichts kosten (bei halbstündlicher Aktualisierung werden 48 API Abfragen pro Tag durchgeführt). Passe die Abfragehäufigkeit daher entsprechend an. Du kannst auch Limits in Deinem Profil festlegen."
HINT_WTTRIN_DESC="Kostenloser Wetterdienst ohne API-Key. Unterstützt Standortabfrage über Ortsnamen oder Koordinaten. Verhalte Dich bitte rücksichtsvoll und übertreibe es nicht mit den Anfragen, damit der Dienst kostenlos bleibt. Eine Abfrage alle 30 oder 60 Minuten sollte in der Regel ausreichend sein, da die Daten nicht ständig aktualisiert werden."
HINT_WETTERONLINE_DESC="Deutscher Wetterdienst mit detaillierten Vorhersagen. Da nur für 48h stündliche Vorhersagen verfügbar sind, werden die fehlenden Werte durch Interpolation aus täglichen Vorhersagen, die Werte im 6h Intervall bieten, berechnet. Kein API-Key erforderlich. Beachte, dass die API nicht dokumentiert ist und sich die Funktionsweise jederzeit ändern kann."
HINT_WEATHERFLOW_DESC="Wetterdienst für WeatherFlow Tempest Stationen. API-Key und Station-ID erforderlich."

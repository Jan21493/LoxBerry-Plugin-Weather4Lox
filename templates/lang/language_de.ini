LABEL_ICONSET="Set für Wettersymbole"
HINT_ICONSET="Wähle das Icon-Set für die Wettersymbole. Die Sets haben unterschiedlich detaillierte Symbole, teilweise mit Mondphasen. Über den Button 'Wettercodes' kannst Du Dir alle Wettersymbole anzeigen lassen."
LABEL_LINK="URL"
HINT_LINK="Unter der angegebenen URL kann die Webseite des Plugins mit Wetterdaten erreicht werden. Diese URL kannst Du als Weblink in Loxone Config hinterlegen, um die Webseite mit dem ausgewählten Theme und Iconset direkt aus der Loxone App zu öffnen."

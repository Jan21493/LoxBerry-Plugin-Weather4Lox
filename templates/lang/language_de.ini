HINT_SECTION_MINISERVER="Die Wetterdaten können auf verschiedene Arten an den Miniserver übermittelt werden. Bitte wähle die Methode aus, die am besten zu Deiner Konfiguration passt. Es ist NICHT sinnvoll, mehr als eine Methode zu aktivieren. Die klare Empfehlung ist die Nutzung von MQTT, da dies die stabilste und zuverlässigste Methode ist."
HINT_SECTION_SENDWHAT="Wähle nur die Tages- und Stundenvorhersagen aus, die an den Miniserver gesendet werden sollen, um die Last auf dem Miniserver so gering wie möglich zu halten. Wenn Du z.B. nur die aktuellen Wetterdaten benötigst, solltest Du die Übertragung der Vorhersagedaten deaktivieren."
HINT_SECTION_MQTT="Sende Wetterdaten per MQTT an den Miniserver. Das MQTT Gateway des LoxBerry wird dafür verwendet. MQTT ist die empfohlene Methode, um Wetterdaten an den Miniserver zu senden, da sie nur geänderte Daten per Push an den MS überträgt und ein aufwändiges Parsen von UDP oder HTTP Eingängen im Miniserver überflüssig macht. HINWEIS: Im MQTT Gateway muss manuell eine Subscription für das Topic eingerichtet werden."
HINT_SECTION_UDP="Sende Wetterdaten über virtuelle UDP-Eingänge an den Miniserver. Diese Methode erfordert die Einrichtung von virtuellen Eingängen im Miniserver und das Parsen der Daten über Logikbausteine, was die Konfiguration aufwändiger und fehleranfälliger macht. Es wird empfohlen, stattdessen MQTT zu verwenden."
HINT_SECTION_HTTP="Stellt Wetterdaten über eine Webseite für den Miniserver bereit, die vom MS regelmäßig abgefragt werden kann (polling). Diese Methode erfordert ebenfalls die Einrichtung von virtuellen HTTP-Eingängen im Miniserver und das Parsen der Daten über Logikbausteine, was die Konfiguration aufwändiger und fehleranfälliger macht. Es wird empfohlen, stattdessen MQTT zu verwenden."
HINT_SECTION_CLOUDEMU="Der Emulator simuliert einen Loxone-Wetterdienst-Server und stellt Wetterdaten lokal bereit. Nützlich wenn der offizielle Loxone-Wetterdienst nicht verfügbar oder nicht gewünscht ist. Wenn kein DNSmasq Plugin installiert ist, dann wird das Paket DNSmasq automatisch beim Aktivieren des Emulators installiert bzw. beim Deaktivieren deinstalliert. Wenn Du DNSmasq für andere Zwecke verwenden möchtest, dann installiere vor dem Aktivieren des Emulators das DNSmasq Plugin.<br><br><b>ACHTUNG:</b> der Emulator funktioniert mit dem Miniserver Gen. 2 nur bis Version 15, da Loxone den Abruf der Wetterdaten auf HTTPS umgestellt hat und Zertifikate die Verbindung sichern. Weitere Hinweise findest Du im Loxforum."

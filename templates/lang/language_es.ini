LABEL_SECTION_STANDARD_WEATHER="Servicio meteorológico predeterminado"
HINT_SECTION_STANDARD_WEATHER="Seleccione el servicio meteorológico principal para obtener datos, pronósticos y datos actuales. Debe seleccionar y activar un servicio principal para usar el plugin. Lea la documentación o las indicaciones de cada servicio para encontrar el adecuado. Configure parámetros y clave API si es necesario más abajo."
LABEL_SECTION_ALTERNATE_WEATHER="Servicio meteorológico alternativo"
HINT_SECTION_ALTERNATE_WEATHER="Opcionalmente, use un servicio alternativo para pronósticos diarios y horarios. Esto puede ser útil si su servicio principal ofrece datos limitados o un periodo de previsión corto. Normalmente el servicio principal debería ser suficiente. Si desea usar servicios alternativos, configure los parámetros y clave API más abajo."
LABEL_SECTION_GENERAL_SETTINGS="Ajustes generales"
HINT_SECTION_GENERAL_SETTINGS="Ajustes básicos que no son específicos de un servicio meteorológico. Introduzca aquí sus coordenadas, ciudad y país, idioma y unidades, y active el enmascaramiento de claves API."
LABEL_SECTION_GRABBER="Mejorar datos meteorológicos actuales"
HINT_SECTION_GRABBER="Active grabbers adicionales para mejorar los datos actuales con una estación local o su Miniserver Loxone. Los datos locales suelen ser más precisos y pueden aportar radiación solar o índice UV. Los datos de los grandes servicios meteorológicos se interpolan normalmente para su ubicación a partir de estaciones cercanas y no siempre son exactos. Los grabbers seleccionados aquí sobrescriben los datos actuales y los complementan con valores adicionales. Tenga en cuenta que estos ajustes solo afectan a los datos actuales, no a las previsiones diarias u horarias."
LABEL_SECTION_POLLEN_AIRQUALITY="Previsión de polen y calidad del aire"
HINT_SECTION_POLLEN_AIRQUALITY="Active la previsión de polen y calidad del aire vía Open-Meteo y configure sus sensibilidades personales. Los datos los proporciona Open-Meteo, un servicio gratuito que no requiere clave API. Tenga en cuenta que la previsión de polen solo está disponible en determinadas regiones y la precisión puede variar según la ubicación."
HINT_VISUALCROSSING_DESC="Servicio meteorológico mundial con datos de previsión. Necesita una clave API gratuita de la web de Visual Crossing (<a href='https://visualcrossing.com/' target='_blank' rel='noopener noreferrer'>visualcrossing.com</a>). Asegúrese de cumplir las condiciones de la licencia API, ya que exceder los límites de uso puede provocar restricciones. Ajuste la frecuencia de consulta en consecuencia. Muchos datos meteorológicos solo se actualizan cada hora, por lo que una consulta cada 30 o 60 minutos suele ser suficiente."
HINT_OPENWEATHER_DESC="Servicio meteorológico global con datos actuales y pronósticos. Necesita una clave API gratuita de la web de OpenWeather (<a href='https://openweathermap.org/' target='_blank' rel='noopener noreferrer'>openweathermap.org</a>). IMPORTANTE: Debe proporcionar información de pago porque se requiere la 'One Call 3.0 API'. Como las primeras 1000 llamadas API al día son gratuitas, el servicio no debería costar nada con un uso normal (con actualizaciones cada media hora solo se realizan 48 llamadas API al día). Ajuste la frecuencia de consulta en consecuencia. También puede establecer límites en su perfil."
HINT_WTTRIN_DESC="Servicio meteorológico gratuito sin clave API. Soporta consultas por nombre de ciudad o coordenadas. Por favor sea considerado y no abuse de las consultas para que el servicio siga siendo gratuito. Una consulta cada 30 o 60 minutos suele ser suficiente ya que los datos no se actualizan constantemente."
HINT_WETTERONLINE_DESC="Servicio meteorológico alemán con pronósticos detallados. Como solo hay previsiones horarias disponibles para 48h, los valores faltantes se calculan por interpolación a partir de previsiones diarias que ofrecen valores en intervalos de 6h. No requiere clave API. Tenga en cuenta que la API no está documentada y puede cambiar en cualquier momento."
HINT_WEATHERFLOW_DESC="Servicio para estaciones WeatherFlow Tempest. Requiere clave API y ID de estación."

LABEL_SECTION_GRABBER="Mejorar datos meteorológicos actuales"
HINT_SECTION_GRABBER="Activa grabbers adicionales para mejorar los datos meteorológicos actuales usando una estación meteorológica local o tu Loxone Miniserver. Los datos actuales de una estación local suelen ser más precisos y proporcionan información adicional, como radiación solar y índice UV. Los datos de los principales servicios meteorológicos se interpolan normalmente para tu ubicación usando estaciones de la zona y no siempre coinciden exactamente. Los grabbers seleccionados aquí sobrescriben los datos meteorológicos actuales y los complementan con valores como radiación solar o índice UV. Ten en cuenta que estos ajustes solo afectan a los datos meteorológicos actuales, no a las previsiones horarias o diarias."

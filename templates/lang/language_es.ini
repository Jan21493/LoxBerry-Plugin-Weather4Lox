HINT_SECTION_MINISERVER="Los datos meteorológicos pueden enviarse al Miniserver de varias formas. Elija el método que mejor se adapte a su configuración. NO tiene sentido activar más de un método. Se recomienda claramente el uso de MQTT, ya que es el método más estable y fiable."
HINT_SECTION_SENDWHAT="Seleccione las previsiones diarias y horarias solo si deben enviarse al Miniserver, para mantener la carga lo más baja posible. Si solo necesita datos actuales, desactive la transmisión de previsiones."
HINT_SECTION_MQTT="Envíe datos meteorológicos vía MQTT al Miniserver. Se utiliza el gateway MQTT de LoxBerry. MQTT es el método recomendado porque es estable y fiable, y hace innecesario el análisis complejo de entradas UDP o HTTP en el Miniserver. NOTA: En el gateway MQTT debe configurarse manualmente una suscripción para el topic."
HINT_SECTION_UDP="Envíe datos meteorológicos vía entradas UDP virtuales al Miniserver. Este método requiere configurar entradas virtuales en el Miniserver y analizar los datos mediante bloques lógicos, lo que hace la configuración más compleja y propensa a errores. Se recomienda usar MQTT en su lugar."
HINT_SECTION_HTTP="Proporciona datos meteorológicos mediante una página web para el Miniserver que puede ser consultada periódicamente por el MS (polling). Este método también requiere configurar entradas HTTP virtuales en el Miniserver y analizar datos mediante bloques lógicos, lo que hace la configuración más compleja y propensa a errores. Se recomienda usar MQTT en su lugar."
HINT_SECTION_CLOUDEMU="El emulador simula un servidor de servicio meteorológico Loxone y provee datos localmente. Útil si el servicio oficial no está disponible o no se desea. ATENCIÓN: el emulador funciona con el Miniserver Gen. 2 solo hasta la versión 15, ya que Loxone ha cambiado la obtención de datos meteorológicos a HTTPS con verificación de certificados. Consulte el Loxforum para más información."

LABEL_SECTION_STANDARD_WEATHER="Standaard Weerservice"
HINT_SECTION_STANDARD_WEATHER="Kies de primaire weerservice voor ophalen van weer-, voorspellings- en actuele data. Je moet een primaire weerservice selecteren en activeren om de plugin te gebruiken. Lees de documentatie of hints bij de diensten om de juiste te vinden. Configureer de parameters en evt. API-sleutel hieronder."
LABEL_SECTION_WEATHER_OBSERVATIONS="Weerservice voor meetwaarden van de afgelopen uren en dagen"
HINT_SECTION_WEATHER_OBSERVATIONS="Optioneel kunt u ook een weerservice gebruiken voor gemeten waarden van de afgelopen uren en dagen. Dit is nuttig om bijvoorbeeld eerdere neerslaghoeveelheden correct weer te geven. De meetwaarden worden aangevuld met historische uurgegevens. Houd er rekening mee dat elk uur een afzonderlijke API-aanroep verbruikt, wat uw API-quota aanzienlijk kan beïnvloeden. Schakel deze functie alleen in als u hem echt nodig hebt."
LABEL_WEATHER_SERVICE_OBS="Weerservice voor meetwaarden"
HINT_CONFIGURE_WEATHER_SERVICE_OBS="Configureer de gekozen weerservice hieronder."
LABEL_FETCH_WEATHER_SERVICE_OBS="Meetwaarden van de afgelopen uren en dagen opnemen"
HINT_FETCH_WEATHER_SERVICE_OBS="Houd er rekening mee dat het ophalen van meetwaarden uw API-quota aanzienlijk belast. Sommige weerservices rekenen 1 API-aanroep per opgehaald uur, d.w.z. tot 192 aanroepen per dag voor 8 dagen. Controleer uw API-licentie."
LABEL_FETCH_DATA_OBS="Historische weerdata ophalen"
HINT_FREE_ACCOUNT_OBS="<b>LET OP:</b> Het ophalen van meetwaarden belast uw API-account aanzienlijk. Controleer uw API-licentie en onze Wiki voor het aantal beschikbare gratis API-aanroepen."
LABEL_SECTION_ALTERNATE_WEATHER="Alternatieve Weerservice"
HINT_SECTION_ALTERNATE_WEATHER="Optioneel kun je een alternatieve dienst gebruiken voor dagelijkse en uurlijkse forecasts. Dit kan nuttig zijn als je primaire dienst beperkte data levert of een kort voorspellingsbereik heeft. Normaal gesproken zou de primaire dienst voldoende moeten zijn. Als je alternatieve diensten wilt gebruiken, configureer de parameters en evt. API-sleutel hieronder."
LABEL_SECTION_GENERAL_SETTINGS="Algemene instellingen"
HINT_SECTION_GENERAL_SETTINGS="Basisinstellingen die niet specifiek zijn voor een weerservice. Voer hier je coördinaten, stad en land, taal en eenheden in en activeer het maskeren van API-sleutels."
LABEL_SECTION_GRABBER="Verbeter actuele weerdata"
HINT_SECTION_GRABBER="Activeer extra grabbers om actuele weerdata te verbeteren met een lokaal weerstation of je Loxone Miniserver. Lokale data zijn doorgaans nauwkeuriger en leveren extra waarden zoals zonnestraling en UV-index. Data van grote weerdiensten worden meestal geïnterpoleerd op basis van omliggende stations en passen niet altijd perfect. De hier geselecteerde grabbers overschrijven actuele data en vullen deze aan. Let op: deze instellingen gelden alleen voor actuele data, niet voor uurlijkse of dagelijkse voorspellingen. De data van je eigen weerstation worden elke minuut opgehaald."
LABEL_SECTION_POLLEN_AIRQUALITY="Pollenvoorspelling en luchtkwaliteit"
HINT_SECTION_POLLEN_AIRQUALITY="Activeer pollen- en luchtkwaliteitsvoorspelling via Open-Meteo en stel persoonlijke allergiegevoeligheden in. Data worden geleverd door Open-Meteo, een gratis dienst zonder API-sleutel. Let op: pollenvoorspellingen zijn alleen beschikbaar voor bepaalde regio's en de nauwkeurigheid kan per locatie variëren."
HINT_VISUALCROSSING_DESC="Wereldwijde weerservice met voorspellingdata. Je hebt een gratis API-sleutel nodig van de Visual Crossing website (<a href='https://visualcrossing.com/' target='_blank' rel='noopener noreferrer'>visualcrossing.com</a>). Zorg ervoor dat je de API-licentievoorwaarden naleeft, aangezien overschrijding van gebruikslimieten tot beperkingen kan leiden. Pas de queryfrequentie dienovereenkomstig aan. Veel weerdata worden slechts elk uur bijgewerkt, dus een query om de 30 of 60 minuten is meestal voldoende."
HINT_OPENWEATHER_DESC="Globale weerservice met actuele data en forecasts. Je hebt een gratis API-sleutel nodig van de OpenWeather website (<a href='https://openweathermap.org/' target='_blank' rel='noopener noreferrer'>openweathermap.org</a>). BELANGRIJK: Je moet betalingsgegevens opgeven omdat de 'One Call 3.0 API' vereist is. Aangezien de eerste 1000 API-calls per dag gratis zijn, zou de dienst bij normaal gebruik niets moeten kosten (bij updates om het halfuur worden slechts 48 API-calls per dag uitgevoerd). Pas je queryfrequentie aan. Je kunt ook limieten instellen in je profiel."
HINT_WTTRIN_DESC="Gratis weerservice zonder API-sleutel. Ondersteunt locatie via naam of coördinaten. Wees alsjeblieft voorzichtig en overdrijf niet met de verzoeken zodat de dienst gratis blijft. Een query om de 30 of 60 minuten is meestal voldoende, aangezien data niet continu worden bijgewerkt."
HINT_WETTERONLINE_DESC="Duitse weerservice met gedetailleerde voorspellingen. Aangezien er slechts 48 uur aan uurlijkse voorspellingen beschikbaar zijn, worden ontbrekende waarden berekend door interpolatie uit dagelijkse voorspellingen die waarden in 6-uursintervallen bieden. Geen API-sleutel nodig. Let op: de API is niet gedocumenteerd en kan op elk moment veranderen."
HINT_WEATHERFLOW_DESC="Weerservice voor WeatherFlow Tempest stations. API-sleutel en station-ID vereist."

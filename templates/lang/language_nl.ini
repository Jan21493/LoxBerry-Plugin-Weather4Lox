HINT_SECTION_MINISERVER="Weerdata kan op verschillende manieren naar de Miniserver worden gestuurd. Kies de methode die het beste bij je configuratie past. Het heeft GEEN zin om meer dan één methode te activeren. MQTT wordt sterk aanbevolen als de meest stabiele en betrouwbare methode."
HINT_SECTION_SENDWHAT="Selecteer dagelijkse en uurlijkse forecasts alleen als deze naar de Miniserver moeten worden gestuurd, om de belasting zo laag mogelijk te houden. Als je alleen actuele weerdata nodig hebt, schakel dan de voorspellingsoverdracht uit."
HINT_SECTION_MQTT="Verstuur weerdata via MQTT naar de Miniserver. Het LoxBerry MQTT gateway wordt hiervoor gebruikt. MQTT is de aanbevolen methode omdat deze stabiel en betrouwbaar is en het complex parsen van UDP- of HTTP-ingangen in de Miniserver overbodig maakt. LET OP: In het MQTT-gateway moet handmatig een subscription voor het topic worden ingesteld."
HINT_SECTION_UDP="Verstuur weerdata via virtuele UDP ingangen naar de Miniserver. Deze methode vereist het opzetten van virtuele ingangen in de Miniserver en het parsen van data via logicablokken, wat de configuratie complexer en foutgevoeliger maakt. Het wordt aanbevolen om in plaats daarvan MQTT te gebruiken."
HINT_SECTION_HTTP="Stelt weerdata beschikbaar via een webpagina voor de Miniserver die regelmatig door de MS kan worden opgevraagd (polling). Deze methode vereist eveneens het opzetten van virtuele HTTP-ingangen en het parsen van data via logicablokken, wat de configuratie complexer en foutgevoeliger maakt. Het wordt aanbevolen om in plaats daarvan MQTT te gebruiken."
HINT_SECTION_CLOUDEMU="De emulator simuleert een Loxone weerservice-server en biedt lokale weerdata. Nuttig als de officiële Loxone weerservice niet beschikbaar of niet gewenst is. Als de DNSmasq-plugin niet is geïnstalleerd, wordt het DNSmasq-pakket automatisch geïnstalleerd wanneer de emulator wordt geactiveerd en verwijderd wanneer deze wordt gedeactiveerd. Als je DNSmasq voor andere doeleinden wilt gebruiken, installeer dan de DNSmasq-plugin voordat je de emulator activeert.<br><br><b>LET OP:</b> de emulator werkt met de Miniserver Gen. 2 alleen tot versie 15, omdat Loxone het ophalen van weerdata heeft overgeschakeld naar HTTPS met certificaatverificatie. Zie het Loxforum voor meer informatie."

HINT_SECTION_MINISERVER="Údaje o počasí mohou být na Miniserver odeslány různými způsoby. Vyberte metodu, která nejlépe vyhovuje vaší konfiguraci. NEMÁ smysl aktivovat více než jednu metodu. Jasně se doporučuje MQTT jako nejstabilnější a nejspolehlivější metoda."
HINT_SECTION_SENDWHAT="Vyberte denní a hodinové předpovědi jen tehdy, pokud se mají posílat na Miniserver, aby byla zátěž co nejnižší. Pokud potřebujete jen aktuální data, deaktivujte přenos předpovědí."
HINT_SECTION_MQTT="Posílejte údaje přes MQTT na Miniserver. Používá se MQTT Gateway LoxBerry. MQTT je doporučená metoda, protože je stabilní a spolehlivá a zbytečný se stává složitý parsing UDP nebo HTTP vstupů v Miniserveru. POZNÁMKA: V MQTT Gateway je třeba manuálně nastavit odběr pro téma."
HINT_SECTION_UDP="Posílejte údaje přes virtuální UDP vstupy na Miniserver. Tato metoda vyžaduje nastavení virtuálních vstupů v Miniserveru a parsing dat přes logické bloky, což dělá konfiguraci složitější a náchylnější k chybám. Doporučujeme namísto toho použít MQTT."
HINT_SECTION_HTTP="Zpřístupňuje údaje o počasí prostřednictvím webové stránky pro Miniserver, kterou může MS pravidelně dopytovat (polling). Tato metoda také vyžaduje nastavení virtuálních HTTP vstupů a parsing dat přes logické bloky, což dělá konfiguraci složitější a náchylnější k chybám. Doporučujeme namísto toho použít MQTT."
HINT_SECTION_CLOUDEMU="Emulátor simuluje Loxone weather-service server a poskytuje lokální údaje. Užitečný, pokud oficiální služba Loxone není dostupná nebo není žádaná. Pokud není nainstalován plugin DNSmasq, balík DNSmasq se automaticky nainstaluje při aktivaci emulátora a odinstaluje při deaktivaci. Pokud chcete používat DNSmasq na jiné účely, nainstalujte plugin DNSmasq před aktivací emulátora.<br><br><b>POZOR:</b> emulátor funguje s Miniserverem Gen. 2 jen do verze 15, protože Loxone přešel na získávání dat přes HTTPS s overováním certifikátů. Další informace najdete v Loxforum."

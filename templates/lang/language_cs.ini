ERR_WETTERONLINE_STATIONID="Názvy měst s pomlčkou '-' nebo lomítkem '/' místo mezer. Přehlásky musí být nahrazeny ae, oe, ue."
HINT_WETTERONLINE_STATIONID="Zadejte zde přesný název místa z URL adresy WetterOnline. Najdete ho tak, že na wetteronline.de vyhledáte své místo a zkopírujete poslední část URL, např. https://www.wetteronline.de/wetter/<b>bratislava</b>. Při víceslovných názvech jsou části spojené pomlčkou '-' nebo lomkou '/'. Slovenské diakritické znaménka jsou redukovány na anglická základní písmena."
LABEL_SECTION_STANDARD_WEATHER="Výchozí služba počasí"
HINT_SECTION_STANDARD_WEATHER="Vyberte primární službu na získávání předpovědí a aktuálních údajů. Na používání pluginu musíte vybrat a aktivovat primární službu. Přečtěte si dokumentaci nebo tipy k jednotlivým službám. Níže nakonfigurujte parametry a příp. API klíč."
LABEL_SECTION_WEATHER_OBSERVATIONS="Meteorologická služba pro měření posledních hodin a dnů"
HINT_SECTION_WEATHER_OBSERVATIONS="Volitelně můžete navíc použít meteorologickou službu pro měření posledních hodin a dnů. To je užitečné například na správné zobrazení historických srážek. Měření jsou doplněna hodinovými historickými údaji. Upozorňujeme, že každá hodina spotřebovává samostatné volání API, což může výrazně zatížit váš API účet. Tuto funkci aktivujte jen pokud ji skutečně potřebujete."
LABEL_WEATHER_SERVICE_OBS="Meteorologická služba pro měření"
HINT_CONFIGURE_WEATHER_SERVICE_OBS="Níže nakonfigurujte vybranou meteorologickou službu."
LABEL_FETCH_WEATHER_SERVICE_OBS="Zahrnout měření posledních hodin a dnů"
HINT_FETCH_WEATHER_SERVICE_OBS="Upozorňujeme, že načtení měření výrazně zatěžuje váš API účet. Některé meteorologické služby účtují 1 API volání za každou načtenou hodinu, t.j. až 192 volání za den pro 8 dní. Zkontrolujte svou API licenci."
LABEL_FETCH_DATA_OBS="Načíst historické údaje o počasí"
HINT_FREE_ACCOUNT_OBS="<b>POZOR:</b> Načtení měření výrazně zatěžuje váš API účet. Zkontrolujte svou API licenci a naše Wiki, kolik bezplatných volání API máte k dispozici."
LABEL_SECTION_ALTERNATE_WEATHER="Alternativní služba počasí"
HINT_SECTION_ALTERNATE_WEATHER="Volitelně můžete použít alternativní službu pro denní/hodinové předpovědi. To může být užitečné, pokud vaše primární služba poskytuje omezená data nebo krátké předpovědní období. Obvykle by měla stačit primární služba. Pokud chcete používat alternativní služby, nakonfigurujte parametry a příp. API klíč níže."
LABEL_SECTION_GENERAL_SETTINGS="Všeobecná nastavení"
HINT_SECTION_GENERAL_SETTINGS="Základní nastavení, která nejsou specifická pro žádnou službu počasí. Zadejte zde své souřadnice, město a zemi, jazyk a jednotky a aktivujte maskování API klíčů."
LABEL_SECTION_GRABBER="Vylepšit aktuální údaje"
HINT_SECTION_GRABBER="Povolte dodatečné grabbery na zlepšení aktuálních údajů lokální stanicí nebo Miniserverem. Lokální data jsou obvykle přesnější a poskytují další hodnoty jako sluneční záření a UV index. Data z velkých služeb se obvykle interpolují z okolních stanic a nemusí vždy přesně sedět. Zde vybrané grabbery přepíší aktuální data a doplní je. Upozorňujeme, že tato nastavení platí jen pro aktuální data, ne pro hodinové nebo denní předpovědi. Pokud chcete získat předpovědi, použijte primární nebo alternativní službu počasí."
LABEL_SECTION_POLLEN_AIRQUALITY="Pyl a kvalita ovzduší"
HINT_SECTION_POLLEN_AIRQUALITY="Povolte předpověď pylu a kvality ovzduší přes Open-Meteo a nastavte své citlivosti. Data poskytuje Open-Meteo, bezplatná služba bez API klíče. Upozorňujeme, že předpověď pylu je dostupná jen pro určité regiony a přesnost se může lišit podle lokality."
HINT_VISUALCROSSING_DESC="Celosvětová služba s předpovědními daty. Potřebujete bezplatný API klíč z webové stránky Visual Crossing (<a href='https://visualcrossing.com/' target='_blank' rel='noopener noreferrer'>visualcrossing.com</a>). Ujistěte se, že dodržujete licenční podmínky API, protože překročení limitů může vést k omezením. Upravte frekvenci dotazů. Mnohá data se aktualizují jen každou hodinu, takže dotaz každých 30 nebo 60 minut je obvykle dostačující."
HINT_OPENWEATHER_DESC="Globální služba s aktuálními daty a předpověďmi. Potřebujete bezplatný API klíč z webové stránky OpenWeather (<a href='https://openweathermap.org/' target='_blank' rel='noopener noreferrer'>openweathermap.org</a>). DŮLEŽITÉ: Musíte poskytnout platební údaje, protože se vyžaduje 'One Call 3.0 API'. Jelikož prvních 1000 API volání za den je zdarma, služba by při běžném používání neměla nic stát (při půlhodinové aktualizaci se provede jen 48 API volání za den). Upravte frekvenci dotazů. Můžete také nastavit limity ve svém profilu."
HINT_WTTRIN_DESC="Bezplatná služba bez API klíče. Podporuje dotaz podle názvu města nebo souřadnic. Buďte prosím ohleduplní a nepřehánějte to s dotazy, aby služba zůstala bezplatná. Dotaz každých 30 nebo 60 minut je obvykle dostačující, protože data se neustále neaktualizují."
HINT_WETTERONLINE_DESC="Německá služba s detailními předpověďmi. Jelikož jsou k dispozici jen 48hodinové hodinové předpovědi, chybějící hodnoty se počítají interpolací z denních předpovědí, které poskytují hodnoty v 6hodinových intervalech. API klíč není potřeba. Poznámka: API není dokumentováno a může se kdykoliv změnit."
HINT_WEATHERFLOW_DESC="Služba pro WeatherFlow Tempest stanice. Vyžaduje API klíč a ID stanice."

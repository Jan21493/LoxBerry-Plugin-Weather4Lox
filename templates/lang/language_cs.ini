HINT_WTTRINSTATIONID="Zadejte název města, pamětihodnost, IATA kód letiště nebo GPS souřadnice (např. 51.07,13.77). Mezery v názvech měst musí být nahrazeny znakem plus '+', např. 'New+York'."
BUTTON_TESTWETTERONLINE="Testovat"

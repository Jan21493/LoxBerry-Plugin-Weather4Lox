LABEL_WEBSITE="Webová stránka"
HINT_SECTION_WEBSITE="Nakonfigurujte vzhled integrované webové stránky s údaji o počasí (téma, iconset, jazyk). Poznámka: jazyk webové stránky je nezávislý od jazyka pluginu. Například můžete nastavit jazyk pluginu na němčinu a jazyk webové stránky na angličtinu, pokud chcete."
LABEL_THEME="Téma"
HINT_THEME="Vyberte téma pro webovou stránku. Ovlivňuje barvy, rozložení a ovládací prvky. Vyzkoušejte v náhledu před aktivací. POZNÁMKA: některá 'classic' témata se aktualizují jen v nakonfigurovaném intervalu."

                                    <p>
                                        <center>
                                            <a id="btncancel" data-role="button" data-inline="true" data-mini="true" data-icon="delete" href="./index.cgi?form=1"><TMPL_VAR SETTINGS.BUTTON_CANCEL></a>
                                                <button type="submit" form="main_form" id="btnsubmit" data-role="button" data-inline="true" data-mini="true" data-icon="check"><TMPL_VAR SETTINGS.BUTTON_SAVE></button>
                                        </center>
                                    </form>
                                    </p>

                                    <!-- Inline save result (hidden by default, shown during/after AJAX save) -->
                                    <div id="save-overlay" style="display:none;">
                                      <center>
                                        <table border="0" style="max-width: 900px; width: 100%;">
                                          <tr>
                                            <td align="center">
                                              <h2 id="save-heading"><TMPL_VAR SETTINGS.HINT_SAVING></h2>
                                              <pre id="save-log" style="text-align:left; white-space:pre-wrap; background:#fff; color:#333; padding:10px; border-radius:6px; border:1px solid #ccc; min-height:200px;"></pre>
                                              <p id="save-back" style="display:none; margin-top:15px;">
                                                <a data-role="button" data-inline="true" data-mini="true" data-icon="back" href="./index.cgi?form=1"><TMPL_VAR SETTINGS.BUTTON_OK></a>
                                              </p>
                                            </td>
                                          </tr>
                                        </table>
                                      </center>
                                    </div>

                                    <script>

                                    // ── Validation rules ──────────────────────────────────────────────────
                                    // Use + (one or more) instead of * (zero or more) to reject empty strings
                                    var RULE_ALPHANUMERIC        = '^[a-zA-Z0-9]+$';         // letters and digits, min 1 char
                                    var RULE_ALPHANUMERIC_OPT    = '^[a-zA-Z0-9]*$';         // letters and digits, optional (empty allowed)
                                    var RULE_DIGITS              = '^\\d+$';                  // digits only, min 1 char
                                    var RULE_HOSTNAME_OR_IPADDR  = 'special:hostname_or_ipaddr'; // hostname or IPv4 address
                                    var RULE_PORT                = 'special:port';            // port number 1-65535
                                    var RULE_PREFIX              = '^[a-zA-Z0-9\\-\\_]+$';         // letters and digits, min 1 char
                                    var RULE_WEATHERFLOW_APIKEY  = '^([A-Za-z0-9\\-]){36}$'; // WeatherFlow API key: 36 chars
                                    var RULE_COORD_LAT           = 'special:number-min-max-value:-90:90';   // latitude -90..90
                                    var RULE_COORD_LONG          = 'special:number-min-max-value:-180:180'; // longitude -180..180
                                    // Station ID: letters, digits, whitespace, accented chars, and some special chars commonly used in station names (e.g. _- . ! ?)
                                    var RULE_WTTRIN_STATIONID    = '^([@~])?([a-zA-Z0-9\\+\\!\\_\\-\\.\\,\\/\\u00C0-\\u017F])*$';
                                    var RULE_WO_STATIONID        = '^[A-Za-z0-9]+([\\-\\/][A-Za-z0-9]+)*$';

                                    // ── Helper: add a field to / remove it from the validation list ───────

                                    function removeFromValidation(selector) {
                                        if (!window.obj_to_validate) return;
                                        var normalized = selector.replace(/(\\)/g, '').replace(/(:|\.|\[|\]|,|=|@)/g, '\\$1');
                                        var idx = $.inArray(normalized, window.obj_to_validate);
                                        if (idx > -1) {
                                            window.obj_to_validate.splice(idx, 1);
                                        }
                                        // Save the original rule (only once) so it can be restored later
                                        if (!$(selector).attr('data-validation-rule-original')) {
                                            $(selector).attr('data-validation-rule-original', $(selector).attr('data-validation-rule'));
                                        }
                                        // Set permissive rule so blur does not trigger error tooltip when field is inactive
                                        $(selector).attr('data-validation-rule', '.*');
                                        // Reset visual state: remove red background and hide error tooltip
                                        $(selector).css('background-color', $(selector).attr('original-background-color') || 'transparent');
                                        $(selector).css('border-radius', 'inherit');
                                        $('#error-msg-' + selector.substring(1)).fadeOut(100);
                                    }

                                    function addToValidation(selector) {
                                        window.obj_to_validate = window.obj_to_validate || [];
                                        var normalized = selector.replace(/(\\)/g, '').replace(/(:|\.|\[|\]|,|=|@)/g, '\\$1');
                                        if ($.inArray(normalized, window.obj_to_validate) === -1) {
                                            window.obj_to_validate.push(normalized);
                                        }
                                        // Restore original validation rule so the field is checked strictly again
                                        var originalRule = $(selector).attr('data-validation-rule-original');
                                        if (originalRule) {
                                            $(selector).attr('data-validation-rule', originalRule);
                                        }
                                    }

                                    // ── save button state based on validation ─────────────
                                    function updateSaveButton() {
                                        if (validate_all()) {
                                            $('#btnsubmit').button('enable');
                                        } else {
                                            $('#btnsubmit').button('disable');
                                        }
                                    }

                                    // ── Check which service fields are currently required ─────────────────
                                    // A service API key is required when the service is selected AND
                                    // the corresponding getdata / usealternatedfc / usealternatehfc is ON
                                    function updateServiceFieldRequirements() {
                                        var getdata         = $('select[name=getdata]').val()         === '1';
                                        var useobs          = $('select[name=useweatherobs]').val()   === '1';
                                        var usedfc          = $('select[name=usealternatedfc]').val() === '1';
                                        var usehfc          = $('select[name=usealternatehfc]').val() === '1';
                                        var mainService     = $('#weatherservice').val();
                                        var obsService      = $('#weatherserviceobs').val();
                                        var dfcService      = $('#weatherservicedfc').val();
                                        var hfcService      = $('#weatherservicehfc').val();

                                        // Check if a service is active in any of the three slots
                                        function isActive(serviceName) {
                                            return ( getdata && mainService === serviceName ) ||
                                                   ( useobs  && obsService  === serviceName ) ||
                                                   ( usedfc  && dfcService  === serviceName ) ||
                                                   ( usehfc  && hfcService  === serviceName );
                                        }

                                        // Visual Crossing
                                        if ( isActive('visualcrossing') ) {
                                            addToValidation('#visualcrossingapikey');
                                        } else {
                                            removeFromValidation('#visualcrossingapikey');
                                        }

                                        // OpenWeather
                                        if ( isActive('openweather') ) {
                                            addToValidation('#openweatherapikey');
                                        } else {
                                            removeFromValidation('#openweatherapikey');
                                        }

                                        // wttr.in
                                        if ( isActive('wttrin') ) {
                                            addToValidation('#wttrinstationid');
                                        } else {
                                            removeFromValidation('#wttrinstationid');
                                        }

                                        // WetterOnline
                                        if ( isActive('wetteronline') ) {
                                            addToValidation('#wetteronlinestationid');
                                        } else {
                                            removeFromValidation('#wetteronlinestationid');
                                        }

                                        // WeatherFlow
                                        if ( isActive('weatherflow') ) {
                                            addToValidation('#weatherflowapikey');
                                            addToValidation('#weatherflowstationid');
                                        } else {
                                            removeFromValidation('#weatherflowapikey');
                                            removeFromValidation('#weatherflowstationid');
                                        }

                                        updateSaveButton();
                                    }

                                    $( document ).ready(function() {
                                        // Intercept Form 1 submit: POST to ajax-save.cgi synchronously
                                        $("#main_form").on("submit", function(e) {
                                            e.preventDefault();

                                            // Run LoxBerry validation before firing AJAX — block if invalid
                                            if (!validate_all()) {
                                                return false;
                                            }
                                            var $form = $(this);

                                            // Hide form, show save overlay
                                            $form.hide();
                                            $("#btncancel").closest("p").hide();
                                            $("#save-overlay").show();
                                            $("#save-heading").text("<TMPL_VAR SETTINGS.HINT_SAVING>");
                                            $("#save-log").text("<TMPL_VAR SETTINGS.SAVING_STARTING>");
                                            $("#save-log").css("color", "#333");
                                            $("#save-back").hide();

                                            $.ajax({
                                                url: "./ajax-save.cgi",
                                                type: "POST",
                                                dataType: "json",
                                                data: $form.serialize() + "&form=1",
                                                cache: false
                                            }).done(function(resp) {
                                                // Show check messages step by step
                                                if (resp && resp.checks && resp.checks.length) {
                                                    var $log = $("#save-log");
                                                    $log.text("");
                                                    var checks = resp.checks;
                                                    var i = 0;
                                                    function showNext() {
                                                        if (i < checks.length) {
                                                            if (i > 0) $log.append("\n");
                                                            $log.append(document.createTextNode(checks[i]));
                                                            // Auto-scroll the log to the bottom
                                                            $log.scrollTop($log[0].scrollHeight);
                                                            i++;
                                                            setTimeout(showNext, 150);
                                                        } else {
                                                            // All messages shown – display final status
                                                            if (resp.ok) {
                                                                $("#save-heading").text("<TMPL_VAR SETTINGS.HINT_OK>");
                                                                $log.css("color", "#080");
                                                            } else {
                                                                $("#save-heading").text("<TMPL_VAR SETTINGS.HINT_ERROR>");
                                                                $log.css("color", "#c00");
                                                                if (resp.error) {
                                                                    $log.append("\n\n" + resp.error);
                                                                }
                                                            }
                                                            $("#save-back").show();
                                                        }
                                                    }
                                                    showNext();
                                                } else {
                                                    // No check messages – show final status immediately
                                                    if (resp && resp.ok) {
                                                        $("#save-heading").text("<TMPL_VAR SETTINGS.HINT_OK>");
                                                        $("#save-log").css("color", "#080");
                                                    } else {
                                                        $("#save-heading").text("<TMPL_VAR SETTINGS.HINT_ERROR>");
                                                        $("#save-log").css("color", "#c00");
                                                        if (resp && resp.error) {
                                                            $("#save-log").text(resp.error);
                                                        }
                                                    }
                                                    $("#save-back").show();
                                                }
                                            }).fail(function(xhr) {
                                                $("#save-heading").text("<TMPL_VAR SETTINGS.HINT_ERROR>");
                                                $("#save-log").text("<TMPL_VAR SETTINGS.SAVING_ERR_START>" + "\n" + (xhr.responseText || ""));
                                                $("#save-log").css("color", "#c00");
                                                $("#save-back").show();
                                            });
                                        });

                                        // Activate on Load
                                        disable();

                                        // Expand collapsible for currently selected weather service
                                        var currentService = '<TMPL_VAR CURRENT_WEATHERSERVICE>';
                                        if ( (currentService) && $( "select[name=getdata]" ).val()  === "1" ) {
                                            $('#section-' + currentService).collapsible('expand');
                                        }
                                        // Expand collapsible for selected weather service for observations if enabled
                                        var currentServiceObs = '<TMPL_VAR CURRENT_WEATHERSERVICEOBS>';
                                        if ( (currentServiceObs) && $( "select[name=useweatherobs]" ).val()  === "1" ) {
                                            $('#section-' + currentServiceObs).collapsible('expand');
                                        }
                                        // Also expand alternate services if enabled
                                        var currentService = '<TMPL_VAR CURRENT_WEATHERSERVICEDFC>';
                                        if ( (currentService) && $( "select[name=usealternatedfc]" ).val()  === "1" ) {
                                            $('#section-' + currentService).collapsible('expand');
                                        }
                                        var currentService = '<TMPL_VAR CURRENT_WEATHERSERVICEHFC>';
                                        if ( (currentService) && $( "select[name=usealternatehfc]" ).val()  === "1" ) {
                                            $('#section-' + currentService).collapsible('expand');
                                        }
                                        // Expand alternate weather service section if either alternate DFC or HFC is enabled
                                        if ( ( $( "select[name=usealternatedfc]" ).val()  === "1" ) || ( $( "select[name=usealternatehfc]" ).val()  === "1" ) ) {
                                            $('#section-alternate-weatherservice').collapsible('expand');
                                        }
                                        // Expand local/own weather service section if one of the grabbers is enabled
                                        if ( ( $( "select[name=wugrabber]" ).val()  === "1" ) || 
                                             ( $( "select[name=foshkgrabber]" ).val()  === "1" ) || 
                                             ( $( "select[name=pwscatchuploadgrabber]" ).val()  === "1" ) || 
                                             ( $( "select[name=loxgrabber]" ).val()  === "1" ) ) {
                                            $('#section-local-weatherservice').collapsible('expand');
                                        }
                                        // Expand pollen / air quality weather service section if either alternate DFC or HFC is enabled
                                        if ( $( "select[name=openmeteoairqualitygrabber]" ).val()  === "1" ) {
                                            $('#section-pollen').collapsible('expand');
                                        }

                                        // Apply named validation rules to input fields - the rules are defined in the variables above
                                        // empty content is not allowed if validation is turned on, see below
                                        $('#wustationid').attr('data-validation-rule',          RULE_ALPHANUMERIC);
                                        $('#loxprefix').attr('data-validation-rule',            RULE_PREFIX);
                                        $('#visualcrossingapikey').attr('data-validation-rule', RULE_ALPHANUMERIC);
                                        $('#openweatherapikey').attr('data-validation-rule',    RULE_ALPHANUMERIC);
                                        $('#wttrinstationid').attr('data-validation-rule',      RULE_WTTRIN_STATIONID); 
                                        $('#wetteronlinestationid').attr('data-validation-rule', RULE_WO_STATIONID);
                                        $('#foshkserver').attr('data-validation-rule',          RULE_HOSTNAME_OR_IPADDR);
                                        $('#foshkport').attr('data-validation-rule',            RULE_PORT);
                                        $('#weatherflowapikey').attr('data-validation-rule',    RULE_WEATHERFLOW_APIKEY);
                                        $('#weatherflowstationid').attr('data-validation-rule', RULE_DIGITS);
                                        $('#coordlat').attr('data-validation-rule',             RULE_COORD_LAT);
                                        $('#coordlong').attr('data-validation-rule',            RULE_COORD_LONG);

                                        // Registers the field: creates error tooltip, hooks blur/input/keyup events
                                        validate_enable('#wustationid');
                                        validate_enable('#foshkserver');
                                        validate_enable('#foshkport');
                                        validate_enable('#loxprefix');
                                        validate_enable('#visualcrossingapikey');
                                        validate_enable('#openweatherapikey');
                                        validate_enable('#wttrinstationid');
                                        validate_enable('#wetteronlinestationid');
                                        validate_enable('#coordlat');
                                        validate_enable('#coordlong');
                                        validate_enable('#weatherflowapikey');
                                        validate_enable('#weatherflowstationid');

                                        // Initialize validation state on page load based on current switch positions
                                        if ( $('select[name=wugrabber]').val()    !== '1' ) removeFromValidation('#wustationid');
                                        if ( $('select[name=foshkgrabber]').val() !== '1' ) { removeFromValidation('#foshkserver'); removeFromValidation('#foshkport'); }

                                    $('select[name=iconset]').attr('data-mini','true');
                                    $('select[name=themelang]').attr('data-mini','true');

                                    // Preview Link for theme and iconset
                                    function preview() {
                                        var themeName = $('#theme').val();
                                        // Old themes (dark, light, custom) are shown via show.cgi, new themes are shown via static html files
                                        if (themeName === "dark" || themeName === "light" || themeName === "fresh" || themeName === "sea" || themeName === "ice" || themeName === "custom") {
                                            var url = './show.cgi?theme=' + themeName + '&iconset=' + $('#iconset').val() + '&lang=' + $('#themelang').val();
                                            window.open(url, 'NewWindow');
                                        } else {
                                            var url = '/plugins/<TMPL_VAR LBPPLUGINDIR>/' + themeName + '.theme.html?mode=' + $('#mode').val() + '&iconset=' + $('#iconset').val() + '&lang=' + $('#themelang').val();
                                            window.open(url, 'NewWindow');
                                        }
                                    }

                                    // Open Weathercodes page
                                    function openWeathercodes() {
                                        var url = '/plugins/<TMPL_VAR LBPPLUGINDIR>/weathercodes.html?size=128&background=e6f7ff&lang=' + encodeURIComponent($('#themelang').val()) + '&iconset=' + encodeURIComponent($('#iconset').val());
                                        window.open(url, '_blank');
                                    }

                                    // Cloud Emu Testlink
                                    $( document ).on( 'change', '#emu', function ( e ) {
                                        if ( $( "select[name=emu]" ).val()  === "1" ) {
                                            //alert("An!");
                                            $('#btntestcloudemu').removeClass('ui-disabled');
                                        } else {
                                            //alert("Aus!");
                                            $('#btntestcloudemu').addClass('ui-disabled');
                                        }
                                    });

                                    // Disable some form elements depending on selected options
                                    function disable() {
                                        if ( $( "select[name=emu]" ).val()  === "0" ) {
                                            $('#btntestcloudemu').addClass('ui-disabled');
                                        }
                                    }

                                    // Activate on Load
                                    disable();

                                    </script>

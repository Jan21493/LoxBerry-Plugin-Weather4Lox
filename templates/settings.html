                                    <script>

                                    $( document ).ready(function() {
                                        // Activate on Load
                                        disable();

                                        // Expand collapsible for currently selected weather service
                                        var currentService = '<TMPL_VAR CURRENT_WEATHERSERVICE>';
                                        if ( (currentService) && $( "select[name=getdata]" ).val()  === "1" ) {
                                            $('#section-' + currentService).collapsible('expand');
                                        }
                                        // Also expand alternate services if enabled
                                        var currentService = '<TMPL_VAR CURRENT_WEATHERSERVICEDFC>';
                                        if ( (currentService) && $( "select[name=usealternatedfc]" ).val()  === "1" ) {
                                            $('#section-' + currentService).collapsible('expand');
                                        }
                                        var currentService = '<TMPL_VAR CURRENT_WEATHERSERVICEHFC>';
                                        if ( (currentService) && $( "select[name=usealternatehfc]" ).val()  === "1" ) {
                                            $('#section-' + currentService).collapsible('expand');
                                        }
                                        // Expand alternate weather service section if either alternate DFC or HFC is enabled
                                        if ( ( $( "select[name=usealternatedfc]" ).val()  === "1" ) || ( $( "select[name=usealternatehfc]" ).val()  === "1" ) ) {
                                            $('#section-alternate-weatherservice').collapsible('expand');
                                        }
                                        // Expand local/own weather service section if one of the grabbers is enabled
                                        if ( ( $( "select[name=wugrabber]" ).val()  === "1" ) || 
                                             ( $( "select[name=foshkgrabber]" ).val()  === "1" ) || 
                                             ( $( "select[name=pwscatchuploadgrabber]" ).val()  === "1" ) || 
                                             ( $( "select[name=loxgrabber]" ).val()  === "1" ) ) {
                                            $('#section-local-weatherservice').collapsible('expand');
                                        }
                                        // Expand pollen / air quality weather service section if either alternate DFC or HFC is enabled
                                        if ( $( "select[name=openmeteoairqualitygrabber]" ).val()  === "1" ) {
                                            $('#section-pollen').collapsible('expand');
                                        }

                                        // Validates
                                        validate_enable('#wustationid');
                                        validate_enable('#foshkserver');
                                        validate_enable('#foshkport');
                                        validate_enable('#visualcrossingapikey');
                                        validate_enable('#openweatherapikey');
                                        validate_enable('#coordlat');
                                        validate_enable('#coordlong');
                                        validate_enable('#weatherflowapikey');
                                        validate_enable('#weatherflowstationid');
                                        validate_enable('#udpport');
                                    });

                                    // Auto-expand collapsible on weather service change
                                    $(document).on('change', '#weatherservice', function() {
                                        $('.service-collapsible').collapsible('collapse');
                                        var selected = $(this).val();
                                        if (selected && $("select[name=getdata]").val() === "1") {
                                            $('#section-' + selected).collapsible('expand');
                                        }
                                    });

                                    // Expand collapsible when alternate DFC service changes
                                    $(document).on('change', '#weatherservicedfc', function() {
                                        var selected = $(this).val();
                                        if (selected && $("select[name=usealternatedfc]").val() === "1") {
                                            $('#section-' + selected).collapsible('expand');
                                        }
                                    });

                                    // Expand collapsible when alternate HFC service changes
                                    $(document).on('change', '#weatherservicehfc', function() {
                                        var selected = $(this).val();
                                        if (selected && $("select[name=usealternatehfc]").val() === "1") {
                                            $('#section-' + selected).collapsible('expand');
                                        }
                                    });

                                    // Add some attributes PERL::CGI doesn't provide
                                    $('select[name=getdata]').attr('data-role','flipswitch');
                                    $('select[name=getdata_forecast]').attr('data-role','flipswitch');
                                    $('select[name=loxgrabber]').attr('data-role','flipswitch');
                                    $('select[name=maskkeys]').attr('data-role','flipswitch');
                                    $('select[name=wugrabber]').attr('data-role','flipswitch');
                                    $('select[name=foshkgrabber]').attr('data-role','flipswitch');
                                    $('select[name=pwscatchuploadgrabber]').attr('data-role','flipswitch');
                                    $('select[name=openmeteoairqualitygrabber]').attr('data-role','flipswitch');
                                    $('select[name=usealternatedfc]').attr('data-role','flipswitch');
                                    $('select[name=usealternatehfc]').attr('data-role','flipswitch');
                                    $('select[name=weatherservice]').attr('data-mini','true');
                                    $('select[name=weatherservicedfc]').attr('data-mini','true');
                                    $('select[name=weatherservicehfc]').attr('data-mini','true');
                                    $('select[name=metric]').attr('data-mini','true');
                                    $('select[name=serverlang]').attr('data-mini','true');
                                    $('select[name=cron]').attr('data-mini','true');
                                    $('select[name=cron_alternate]').attr('data-mini','true');
                                    $('select[name=pollen_grasses]').attr('data-mini','true');
                                    $('select[name=pollen_birch]').attr('data-mini','true');
                                    $('select[name=pollen_alder]').attr('data-mini','true');
                                    $('select[name=pollen_mugwort]').attr('data-mini','true');
                                    $('select[name=pollen_olive]').attr('data-mini','true');
                                    $('select[name=pollen_ragweed]').attr('data-mini','true');

                                    // Get Data
                                    $( document ).on( 'change', '#getdata', function ( e ) {
                                        if ( $( "select[name=getdata]" ).val()  === "1" ) {
                                            //alert("An!");
                                            $('#cron').removeClass('ui-disabled');
                                            $('#cron').selectmenu('refresh');
                                            // expand section of selected weather service
                                            var selected = $('#weatherservice').val();
                                            if (selected) {
                                                $('#section-' + selected).collapsible('expand');
                                            }
                                        } else {
                                            //alert("Aus!");
                                            $('#cron').addClass('ui-disabled');
                                            $('#cron').selectmenu('refresh');
                                            // collapse previously selected weather service
                                            var selected = $('#weatherservice').val();
                                            if (selected) {
                                                $('#section-' + selected).collapsible('collapse');
                                            }
                                        }
                                    });

                                    // Get Data Forecast
                                    $( document ).on( 'change', '#usealternatedfc', function ( e ) {
                                        if ( ( $( "select[name=usealternatedfc]" ).val()  === "1" ) || ( $( "select[name=usealternatehfc]" ).val()  === "1" ) ) {
                                            //alert("An!");
                                            $('#cron_alternate').removeClass('ui-disabled');
                                            $('#cron_alternate').selectmenu('refresh');
                                        } else {
                                            //alert("Aus!");
                                            $('#cron_alternate').addClass('ui-disabled');
                                            $('#cron_alternate').selectmenu('refresh');
                                        }
                                        // expand or collapse selected alternate weather service
                                        if ( $( "select[name=usealternatedfc]" ).val()  === "1" ) {
                                            // expand section of selected weather service
                                            var selected = $('#weatherservicedfc').val();
                                            if (selected) {
                                                $('#section-' + selected).collapsible('expand');
                                            }
                                        } else {
                                            // collapse section of selected weather service
                                            var selected = $('#weatherservicedfc').val();
                                            if (selected) {
                                                $('#section-' + selected).collapsible('collapse');
                                            }
                                        }
                                    });
                                    $( document ).on( 'change', '#usealternatehfc', function ( e ) {
                                        if ( ( $( "select[name=usealternatehfc]" ).val()  === "1" ) || ( $( "select[name=usealternatedfc]" ).val()  === "1" ) ) {
                                            //alert("An!");
                                            $('#cron_alternate').removeClass('ui-disabled');
                                            $('#cron_alternate').selectmenu('refresh');
                                        } else {
                                            //alert("Aus!");
                                            $('#cron_alternate').addClass('ui-disabled');
                                            $('#cron_alternate').selectmenu('refresh');
                                        }
                                        // expand or collapse selected alternate weather service
                                        if ( $( "select[name=usealternatehfc]" ).val()  === "1" ) {
                                            // expand section of selected weather service
                                            var selected = $('#weatherservicehfc').val();
                                            if (selected) {
                                                $('#section-' + selected).collapsible('expand');
                                            }
                                        } else {
                                            // collapse section of selected weather service
                                            var selected = $('#weatherservicehfc').val();
                                            if (selected) {
                                                $('#section-' + selected).collapsible('collapse');
                                            }
                                        }
                                    });
                                    // TODO: verify if this can be removed after above two handlers are working correctly
                                    $( document ).on( 'change', '#getdata_forecast', function ( e ) {
                                        if ( $( "select[name=getdata_forecast]" ).val()  === "1" ) {
                                            //alert("An!");
                                            $('#cron_alternate').removeClass('ui-disabled');
                                            $('#cron_alternate').selectmenu('refresh');
                                        } else {
                                            //alert("Aus!");
                                            $('#cron_alternate').addClass('ui-disabled');
                                            $('#cron_alternate').selectmenu('refresh');
                                        }
                                    });

                                    // WUGrabber
                                    $( document ).on( 'change', '#wugrabber', function ( e ) {
                                        if ( $( "select[name=wugrabber]" ).val()  === "1" ) {
                                            //alert("An!");
                                            $('#labelwustationid').removeClass('ui-disabled');
                                            $('#wustationid').removeClass('ui-disabled');
                                        } else {
                                            //alert("Aus!");
                                            $('#labelwustationid').addClass('ui-disabled');
                                            $('#wustationid').addClass('ui-disabled');
                                        }
                                    });

                                    // FOSHKGrabber
                                    $( document ).on( 'change', '#foshkgrabber', function ( e ) {
                                        if ( $( "select[name=foshkgrabber]" ).val()  === "1" ) {
                                            //alert("An!");
                                            $('#labelfoshkserver').removeClass('ui-disabled');
                                            $('#foshkserver').removeClass('ui-disabled');
                                            $('#labelfoshkport').removeClass('ui-disabled');
                                            $('#foshkport').removeClass('ui-disabled');
                                        } else {
                                            //alert("Aus!");
                                            $('#labelfoshkserver').addClass('ui-disabled');
                                            $('#foshkserver').addClass('ui-disabled');
                                            $('#labelfoshkport').addClass('ui-disabled');
                                            $('#foshkport').addClass('ui-disabled');
                                        }
                                    });

                                    // OpenMeteoAirQualityGrabber
                                    $( document ).on( 'change', '#openmeteoairqualitygrabber', function ( e ) {
                                        if ( $( "select[name=openmeteoairqualitygrabber]" ).val()  === "1" ) {
                                            $('.pollen-row').show();
                                            $('#rowpollensettings').show();
                                        } else {
                                            $('.pollen-row').hide();
                                            $('#rowpollensettings').hide();
                                        }
                                    });

                                    // Pollen hint texts by level
                                    var pollenHints = {
                                        '0': '<TMPL_VAR SETTINGS.HINT_POLLEN_LEVEL_0>',
                                        '1': '<TMPL_VAR SETTINGS.HINT_POLLEN_LEVEL_1>',
                                        '2': '<TMPL_VAR SETTINGS.HINT_POLLEN_LEVEL_2>',
                                        '3': '<TMPL_VAR SETTINGS.HINT_POLLEN_LEVEL_3>',
                                        '4': '<TMPL_VAR SETTINGS.HINT_POLLEN_LEVEL_4>',
                                        '5': '<TMPL_VAR SETTINGS.HINT_POLLEN_LEVEL_5>',
                                        '6': '<TMPL_VAR SETTINGS.HINT_POLLEN_LEVEL_6>',
                                        '7': '<TMPL_VAR SETTINGS.HINT_POLLEN_LEVEL_7>'
                                    };
                                    function updatePollenHint(name) {
                                        var val = $('select[name=' + name + ']').val();
                                        $('#hint_pollen_' + name.replace('pollen_','') ).text(pollenHints[val] || '');
                                    }
                                    var pollenNames = ['pollen_grasses','pollen_birch','pollen_alder','pollen_mugwort','pollen_olive','pollen_ragweed'];
                                    $.each(pollenNames, function(i, name) {
                                        updatePollenHint(name);
                                        $( document ).on( 'change', '#' + name, function() { updatePollenHint(name); });
                                    });

                                    // Alternate DFC
                                    $( document ).on( 'change', '#usealternatedfc', function ( e ) {
                                        if ( $( "select[name=usealternatedfc]" ).val()  === "1" ) {
                                            //alert("An!");
                                            $('#weatherservicedfc').removeClass('ui-disabled');
                                            $('#weatherservicedfc').selectmenu('refresh');
                                        } else {
                                            //alert("Aus!");
                                            $('#weatherservicedfc').addClass('ui-disabled');
                                            $('#weatherservicedfc').selectmenu('refresh');
                                        }
                                    });

                                    // Alternate HFC
                                    $( document ).on( 'change', '#usealternatehfc', function ( e ) {
                                        if ( $( "select[name=usealternatehfc]" ).val()  === "1" ) {
                                            //alert("An!");
                                            $('#weatherservicehfc').removeClass('ui-disabled');
                                            $('#weatherservicehfc').selectmenu('refresh');
                                        } else {
                                            //alert("Aus!");
                                            $('#weatherservicehfc').addClass('ui-disabled');
                                            $('#weatherservicehfc').selectmenu('refresh');
                                        }
                                    });

                                    // Disable some form elements depending on selected options
                                    function disable() {
                                        if ( $( "select[name=usealternatedfc]" ).val()  === "0" ) {
                                            $('#weatherservicedfc').addClass('ui-disabled');
                                            $('#weatherservicedfc').selectmenu('refresh');
                                        }
                                        if ( $( "select[name=usealternatehfc]" ).val()  === "0" ) {
                                            $('#weatherservicehfc').addClass('ui-disabled');
                                            $('#weatherservicehfc').selectmenu('refresh');
                                        }
                                        if ( ( $( "select[name=usealternatedfc]" ).val()  === "0" ) && ( $( "select[name=usealternatehfc]" ).val()  === "0" ) )
                                        {
                                            $('#cron_alternate').addClass('ui-disabled');
                                            $('#cron_alternate').selectmenu('refresh');
                                        }
                                        if ( $( "select[name=getdata]" ).val()  === "0" ) {
                                            $('#cron').addClass('ui-disabled');
                                        }
                                        if ( $( "select[name=getdata_forecast]" ).val()  === "0" ) {
                                            $('#cron').addClass('ui-disabled');
                                        }
                                        if ( $( "select[name=wugrabber]" ).val()  === "0" ) {
                                            $('#labelwustationid').addClass('ui-disabled');
                                            $('#wustationid').addClass('ui-disabled');
                                        }
                                        if ( $( "select[name=foshkgrabber]" ).val()  === "0" ) {
                                            $('#labelfoshkserver').addClass('ui-disabled');
                                            $('#foshkserver').addClass('ui-disabled');
                                            $('#labelfoshkport').addClass('ui-disabled');
                                            $('#foshkport').addClass('ui-disabled');
                                        }
                                        if ( $( "select[name=openmeteoairqualitygrabber]" ).val()  === "0" ) {
                                            $('.pollen-row').hide();
                                            $('#rowpollensettings').hide();
                                        }
                                    }

                                    function fetchweather()
                                    {

                                        $('#fetch').addClass('ui-disabled');
                                        $("#fetchstate").attr("style", "color:blue").html("<TMPL_VAR SETTINGS.HINT_FETCHWAIT>");
                                        $.ajax( {
                                                type: 'POST',
                                                url: "./ajax-handler.cgi",
                                                data: {
                                                    ajax: 'fetch',
                                                }
                                            } )
                                        .done(function(resp) {
                                            console.log( "fetch", "success", resp );
                                            $("#fetchstate").attr("style", "color:green").html("<TMPL_VAR SETTINGS.HINT_FETCHOK>");
                                        })
                                        .fail(function(resp) {
                                            console.log( "fetch", "failed", resp );
                                            $("#fetchstate").attr("style", "color:red").html("<TMPL_VAR SETTINGS.HINT_FETCHFAILED>");
                                        })
                                        .always(function(resp) {
                                        $('#fetch').removeClass('ui-disabled');
                                            console.log( "fetch", "finished", resp );
                                        });

                                    }

                                    // Test Link for wtt.in
                                    function testwttrin() {
                                        var url = 'https://wttr.in/' + $('#wttrinstationid').val();
                                        window.open(url, 'NewWindow');
                                    }

                                    // Test Link for Wetteronline
                                    function testwetteronline() {
                                        var url = 'https://www.wetteronline.de/wetter/' + $('#wetteronlinestationid').val();
                                        window.open(url, 'NewWindow');
                                    }

                                    </script>

<TMPL_IF SAVING>
  <center>
    <table border="0" style="max-width: 900px; width: 100%;">
      <tr>
        <td align="center">
          <h2 id="savinghint"><TMPL_VAR SETTINGS.HINT_SAVING></h2>
          <p id="savingmsg"><TMPL_VAR SAVINGMESSAGE></p>

          <pre id="savinglog" style="text-align:left; white-space:pre-wrap; background:#fff; color:#333; padding:10px; border-radius:6px; border:1px solid #ccc; min-height:200px;"></pre>
          <p id="savingback" style="display:none; margin-top:15px;">
            <a data-role="button" data-inline="true" data-mini="true" data-icon="back" href="./index.cgi?form=<TMPL_VAR FORMNO>"><TMPL_VAR SETTINGS.BUTTON_OK></a>
          </p>
        </td>
      </tr>
    </table>
  </center>

  <script>
    // These are set by index.cgi:
    var saveToken = "<TMPL_VAR SAVETOKEN>";
    var saveForm  = "<TMPL_VAR FORMNO>";

    function pollStatus() {
        $.ajax({
            url: "./ajax-save.cgi",
            data: { status: saveToken },
            dataType: "json",
            cache: false
        }).done(function(resp){
            if(resp && resp.log !== undefined) {
                $("#savinglog").text(resp.log);
            }
            if(resp && resp.done) {
                $("#savinghint").hide();
                $("#savingmsg").hide();
                if(resp.has_error) {
                    // Show error – keep the log visible, add a back-link
                    $("#savinglog").css("color", "#c00");
                } else {
                    // Success – keep the log visible so user can read messages
                    $("#savinglog").css("color", "#080");
                }
                $("#savingback").show();
            } else {
                setTimeout(pollStatus, 500);
            }
        }).fail(function(){
            setTimeout(pollStatus, 1000);
        });
    }

    function startSave() {
        $.ajax({
            url: "./ajax-save.cgi",
            type: "POST",
            dataType: "json",
            data: { start: 1, form: saveForm, token: saveToken },
            cache: false
        }).done(function(resp){
            if(resp && resp.ok) {
                pollStatus();
            } else {
                $("#savinglog").text("<TMPL_VAR SETTINGS.SAVING_ERR_START>" + "\n" + (resp && resp.error ? resp.error : ""));
                $("#savinglog").css("color", "#c00");
                $("#savingback").show();
            }
        }).fail(function(xhr){
            $("#savinglog").text("<TMPL_VAR SETTINGS.SAVING_ERR_START>" + "\n" + (xhr.responseText||""));
            $("#savinglog").css("color", "#c00");
            $("#savingback").show();
        });
    }

    $(document).ready(function(){
      startSave();
    });
  </script>
</TMPL_IF>

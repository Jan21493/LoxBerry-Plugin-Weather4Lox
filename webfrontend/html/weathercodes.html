<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather4Lox Codes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* Prevent horizontal scrollbar */
    html, body {
      overflow-x: hidden;
    }

    :root {
      /* tweak these values to change base column sizing */
      --num-col-width: 50px;         /* width for Weather4Lox number column */
      --code-col-width: 120px;         /* width for Weather4Lox Code column */
      --desc-col-width: 200px; 
      --icon-col-width: calc(var(--icon-size) * 3); 
      --remarks-col-width: calc(var(--desc-col-width) * 2); 
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: #1a3a5c;
      color: #fff;
      padding: 1rem 2rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.75;
    }

    .controls {
      background: #fff;
      border-bottom: 1px solid #dde8f4;
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
    }

    .control-group label {
      font-weight: 600;
      white-space: nowrap;
      color: #1a3a5c;
    }

    .control-group select {
      padding: 0.3rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.88rem;
      background: #fff;
    }

    .control-group input[type=range] {
      width: 120px;
    }

    .size-display {
      font-size: 0.8rem;
      color: #666;
      min-width: 3rem;
    }

    /* Make the main container span the full window width */
    .container {
      max-width: none;
      width: 100%;
      margin: 0;
      padding: 1.5rem 1rem;
    }

    .category-section {
      margin-bottom: 2rem;
    }

    .category-section h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a3a5c;
      padding: 0.6rem 1rem;
      background: #dde8f4;
      border-left: 4px solid #1a3a5c;
      border-radius: 0 6px 6px 0;
      margin-bottom: 0.5rem;
    }

    /* Table */
    .codes-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-size: 0.88rem;
      table-layout: auto; /* allow columns to size naturally but respect min-widths */
      word-break: break-word;
      overflow-wrap: anywhere;
    }

    .codes-table thead th {
      background: #f0f4f8;
      padding: 0.65rem 0.75rem;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #dde8f4;
      white-space: nowrap;
    }

    .codes-table tbody tr:nth-child(even) { background: #fafbfc; }
    .codes-table tbody tr:hover { background: #edf4ff; }

    .codes-table td {
      padding: 0.55rem 0.75rem;
      vertical-align: middle;
      border-bottom: 1px solid #eee;
      white-space: normal; /* allow wrapping */
    }

    .codes-table td.nr { width: 2.5rem; text-align: center; color: #888; font-size: 0.8rem; }

    /* enforce sensible min/target widths so columns don't shrink too hard */
    th.col-num, td.col-num {
      min-width: var(--num-col-width);
      width: var(--num-col-width);
    }

    th.col-code, td.col-code {
      min-width: var(--code-col-width);
      width: var(--code-col-width);
      font-family: monospace;
      font-size: 0.82rem;
      color: #0d4a8a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th.col-desc, td.col-desc {
      width: var(--desc-col-width);
    }

   th.col-icon, td.col-icon {
      width: var(--icon-col-width);
    }

    th.col-remarks, td.col-remarks {
      width: var(--remarks-col-width);
      color: #666;
    }

    .codes-table td.desc { color: #444; }
    .codes-table td.remarks { color: #666; }

    .icon-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .icon-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      border-radius: 4px;
      cursor: default;
    }

    .icon-wrapper img {
      display: block;
      object-fit: contain;
    }

    .icon-missing {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      border: 1px dashed #ccc;
      border-radius: 4px;
      color: #bbb;
      font-size: clamp(8px, calc(var(--icon-size) * 0.5), 400px);
      text-align: center;
    }

    /* Custom tooltip */
    .icon-wrapper .tooltip {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,40,70,0.95);
      color: #fff;
      padding: 0.4rem 0.6rem;
      border-radius: 5px;
      font-size: 0.72rem;
      white-space: nowrap;
      z-index: 100;
      pointer-events: none;
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .icon-wrapper .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(20,40,70,0.95);
      --icon-size: 48px; /* Default fallback */
    }

    .icon-wrapper:hover .tooltip {
      display: block;
    }

    /* Expand button & details row */
    .expand-btn {
      background: transparent;
      border: 1px solid #cfdcf0;
      padding: 0.25rem 0.4rem;
      border-radius: 4px;
      cursor: pointer;
      color: #1a3a5c;
      font-weight: 600;
    }
    .expand-btn[aria-expanded="true"] {
      background: #e8f1ff;
    }
    .row-details {
      display: none;
      background: #ffffff;
    }
    .row-details td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid #eee;
      background: #fbfdff;
    }

    /* Column visibility for responsive collapse
       - <=900px: hide icon column (so icons don't force very wide rows)
       - <=600px: also hide description and remarks to avoid extreme shrinking;
                 user can use expand to see hidden content.
    */

    /* default: hide expand control */
    .col-expand, th.col-expand {
      display: none;
      width: 2.5rem;
      text-align: center;
    }

    @media (max-width: 900px) {
      /* remove only icon column at this breakpoint */
      .col-icon, th.col-icon {
        display: none;
      }
      .col-expand, th.col-expand {
        display: table-cell;
      }

      /* Give code/desc/remarks more breathing room - don't allow them to shrink below min-widths */
      th.col-code, td.col-code { min-width: calc(var(--code-col-width) - 10px); }
      th.col-desc, td.col-desc { width: calc(var(--desc-col-width) - 40px); }
      th.col-remarks, td.col-remarks { width: calc(var(--remarks-col-width) - 30px); }
    }

    @media (max-width: 600px) {
      /* hide description & remarks only on very narrow viewports */
      .col-desc, th.col-desc, .col-remarks, th.col-remarks {
        display: none;
      }
      .col-expand, th.col-expand {
        display: table-cell;
      }
      /* keep code column still readable */
      th.col-code, td.col-code {
        min-width: calc(var(--code-col-width) - 30px);
      }
    }

    @media (max-width: 480px) {
      /* on very small devices reduce some padding to avoid overflow */
      .codes-table thead th, .codes-table td { padding: 0.4rem 0.5rem; }
    }

    @media (max-width: 768px) {
      .codes-table { font-size: 0.78rem; }
      .controls { padding: 0.5rem 1rem; gap: 1rem; }
    }
  </style>
</head>

<script>
// ---------------------------------------------------------------------------
// Weather code definitions (45 codes)
// ---------------------------------------------------------------------------

const WEATHER_CODES = [
  [1,  'clear',                      'both'],
  [2,  'fair',                       'both'],
  [3,  'partly_cloudy',              'both'],
  [4,  'cloudy',                     'both'],
  [5,  'overcast',                   'both'],
  [10,  'cloudy_shower_1',            'forecast'],
  [11,  'cloudy_shower_2',            'forecast'],
  [12,  'overcast_shower_1',          'both'],
  [13,  'overcast_shower_2',          'both'],
  [14,  'overcast_shower_3',          'both'],
  [20, 'cloudy_rain_1',              'forecast'],
  [21, 'cloudy_rain_2',              'forecast'],
  [22, 'overcast_rain_1',            'both'],
  [23, 'overcast_rain_2',            'both'],
  [24, 'overcast_rain_3',            'both'],
  [30, 'cloudy_sleet_1',             'forecast'],
  [31, 'cloudy_sleet_2',             'forecast'],
  [32, 'overcast_sleet_1',           'both'],
  [33, 'overcast_sleet_2',           'both'],
  [34, 'overcast_sleet_3',           'both'],
  [40, 'cloudy_snow_1',              'forecast'],
  [41, 'cloudy_snow_2',              'forecast'],
  [42, 'overcast_snow_1',            'both'],
  [43, 'overcast_snow_2',            'both'],
  [44, 'overcast_snow_3',            'both'],
  [50, 'cloudy_freezingrain_1',      'forecast'],
  [51, 'cloudy_freezingrain_2',      'forecast'],
  [52, 'overcast_freezingrain_1',    'both'],
  [53, 'overcast_freezingrain_2',    'both'],
  [54, 'overcast_freezingrain_3',    'both'],
  [60, 'cloudy_thunderstorm_1',      'forecast'],
  [61, 'cloudy_thunderstorm_2',      'forecast'],
  [62, 'overcast_thunderstorm_1',    'both'],
  [63, 'overcast_thunderstorm_2',    'both'],
  [64, 'overcast_thunderstorm_3',    'both'],
  [70, 'cloudy_snowthunderstorm_1',  'forecast'],
  [71, 'cloudy_snowthunderstorm_2',  'forecast'],
  [72, 'overcast_snowthunderstorm_1','both'],
  [73, 'overcast_snowthunderstorm_2','both'],
  [74, 'overcast_snowthunderstorm_3','both'],
  [80, 'cloudy_fog',                 'both'],
  [81, 'overcast_fog',               'both'],
  [82, 'overcast_hail_1',            'both'],
  [83, 'overcast_hail_2',            'both'],
  [84, 'overcast_hail_3',            'both'],
  [99, 'no_data',                    'both'],
];

const CATEGORIES = [
  { key: 'cloud_cover',        codes: [1, 2, 3, 4, 5] },
  { key: 'shower',            codes: [10, 11, 12, 13, 14] },
  { key: 'rain',                codes: [20, 21, 22, 23, 24] },
  { key: 'sleet',               codes: [30, 31, 32, 33, 34] },
  { key: 'snow',                codes: [40, 41, 42, 43, 44] },
  { key: 'freezing_rain',       codes: [50, 51, 52, 53, 54] },
  { key: 'thunderstorm',        codes: [60, 61, 62, 63, 64] },
  { key: 'snow_thunderstorm',   codes: [70, 71, 72, 73, 74] },
  { key: 'fog',                 codes: [80, 81] },
  { key: 'hail',                codes: [82, 83, 84] },
  { key: 'special',             codes: [99] }, 
  { key: 'statistics',          codes: [] },
];

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

let lang = {};
let iconMapping = null;
let iconSize = 48;
let iconsetPath = '';

let pendingIconSetInfo = null;

// ---------------------------------------------------------------------------
// Plugin base path detection
// ---------------------------------------------------------------------------

function getPluginBase() {
  const pathParts = window.location.pathname.split('/');
  const pluginsIdx = pathParts.indexOf('plugins');
  if (pluginsIdx !== -1 && pathParts[pluginsIdx + 1]) {
    return '/plugins/' + pathParts[pluginsIdx + 1];
  }
  return '';
}

const pluginBase = getPluginBase();

// ---------------------------------------------------------------------------
// URL parameters
// ---------------------------------------------------------------------------

const urlParams = new URLSearchParams(window.location.search);

// Sanitize: only allow alphanumeric chars (plus hyphen/underscore) to prevent path traversal
function sanitizeParam(val, fallback) {
  if (!val) return fallback;
  return /^[a-zA-Z0-9_-]+$/.test(val) ? val : fallback;
}

// Validate hex color (with or without leading '#', and allowing 3,4,6,8 digit formats)
function isValidHexColor(val) {
  if (!val || typeof val !== 'string') return false;
  const s = val.trim().toLowerCase();
  // erlaubt: #RGB, #RRGGBB, #RGBA, #RRGGBBAA oder ohne führendes '#'
  return /^#?([0-9a-f]{3}|[0-9a-f]{4}|[0-9a-f]{6}|[0-9a-f]{8})$/.test(s);
}
function normalizeHex(val, fallback = '#e6f7ff') {
  if (!isValidHexColor(val)) return fallback;
  let s = val.trim().toLowerCase();
  if (s[0] !== '#') s = '#' + s;
  return s;
}

const urlLang = sanitizeParam((urlParams.get('lang') || 'en').toLowerCase(), 'en');
const urlIconset = sanitizeParam(urlParams.get('iconset'), 'naturalistic');
let bgColor = normalizeHex('#' +urlParams.get('background'), '#e6f7ff');


// Parse numeric "size" parameter (optional) and clamp/align to step
let urlSize = null;
(function() {
  const raw = urlParams.get('size');
  if (raw && /^[0-9]+$/.test(raw)) {
    let v = parseInt(raw, 10);
    const MIN = 32, MAX = 1024, STEP = 8;
    if (isFinite(v)) {
      if (v < MIN) v = MIN;
      if (v > MAX) v = MAX;
      // Align to step (8)
      v = Math.round(v / STEP) * STEP;
      urlSize = v;
    }
  }
})();

// ---------------------------------------------------------------------------
// Load language JSON
// ---------------------------------------------------------------------------

async function loadLang(langCode) {
  const supported = ['en', 'de', 'nl', 'es', 'sk'];
  const code = supported.includes(langCode) ? langCode : 'en';
  try {
    const resp = await fetch(pluginBase + '/lang-' + code + '.json');
    if (resp.ok) {
      lang = await resp.json();
    }
  } catch (e) {
    lang = {};
  }
}

function t(key) {
  return lang[key] || key;
}

function tDesc(code) {
  if (lang.weather_descriptions && lang.weather_descriptions[code]) {
    return lang.weather_descriptions[code];
  }
  return code;
}

function tRemark(code) {
  if (lang.weather_remarks && lang.weather_remarks[code]) {
    return lang.weather_remarks[code];
  }
  return code;
}

function tCategory(code) {
  if (lang.weather_categories && lang.weather_categories[code]) {
    return lang.weather_categories[code];
  }
  return code;
}

function tMoonPhase(phaseIdx) {
  const key = 'moon_phase_' + phaseIdx;
  return lang[key] || ('Phase ' + phaseIdx);
}

// ---------------------------------------------------------------------------
// Helpers for icon set info extraction and display
// ---------------------------------------------------------------------------

// Check with HEAD if a URL exists (with timeout)
async function urlExists(url, timeoutMs = 3000) {
  try {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeoutMs);
    const resp = await fetch(url, { method: 'HEAD', signal: controller.signal });
    clearTimeout(timer);
    return resp.ok;
  } catch (e) {
    // Network error, CORS, timeout → treat as "not found"
    return false;
  }
}

// Helper function: map with limited concurrency
async function mapWithConcurrency(items, fn, concurrency = 8) {
  const results = new Array(items.length);
  let i = 0;
  async function worker() {
    while (true) {
      const idx = i++;
      if (idx >= items.length) return;
      results[idx] = await fn(items[idx]);
    }
  }
  const workers = [];
  const n = Math.min(concurrency, items.length);
  for (let w = 0; w < n; w++) workers.push(worker());
  await Promise.all(workers);
  return results;
}

// Cache for already checked URLs (avoids duplicate requests)
const _iconUrlExistenceCache = new Map();

// Async: calculates icon set info AND checks if the referenced files exist
async function computeIconSetInfo(iconMapping) {
  if (!iconMapping || !iconMapping.icons) return null;
  const icons = iconMapping.icons;
  const keys = Object.keys(icons);

  let symbolsDay = 0;
  let symbolsNight = 0;

  const filesToCheck = []; // absolute URLs
  const ext = '.' + (iconMapping.format || 'png');
  const basePath = iconsetPath || ''; // sollte gesetzt sein vor Aufruf

  keys.forEach(function(k) {
    const e = icons[k] || {};
    if (e.icon_day) {
      const url = basePath + e.icon_day;
      filesToCheck.push(url);
      symbolsDay++;
    }
    if (e.icon_night) {
      let moonPhases = e.moon_phases || 0;
      if (![0, 3, 5].includes(moonPhases)) {
        console.warn('Unexpected moon_phases value for code ' + k + ': ' + moonPhases);
        moonPhases = 0;
      }
      
      if (moonPhases === 0) {
        const url = basePath + e.icon_night;
        filesToCheck.push(url);
        symbolsNight++;
      } else {
        for (let i = 0; i < moonPhases; i++) {
          const pchar = moonPhases === 3 ? 'h' : 'q'; // 'h' for half phases, 'q' for quarter phases
          const fname = phaseFilename(e.icon_night, i, pchar, ext);
          const url = basePath + fname;
          filesToCheck.push(url);
          symbolsNight++; 
        }
      }
    }
  });

  // remove duplicates to minimize number of URL checks (icons can be shared between codes)
  const uniqueUrls = Array.from(new Set(filesToCheck));

  // check function with cache
  async function checkUrl(url) {
    if (_iconUrlExistenceCache.has(url)) return _iconUrlExistenceCache.get(url);
    const ok = await urlExists(url, 2500);
    _iconUrlExistenceCache.set(url, ok);
    return ok;
  }

  // Check URLs with limited concurrency
  const existenceResults = await mapWithConcurrency(uniqueUrls, checkUrl, 10);

  // Count only existing files in uniqueFileCount
  let uniqueFileCount = 0;
  for (let i = 0; i < uniqueUrls.length; i++) {
    if (existenceResults[i]) uniqueFileCount++;
  }

  const format = iconMapping.format || 'png';
  const version = iconMapping.version || 'unknown';

  return {
    version,
    format,
    total_symbols: symbolsDay +  symbolsNight,
    symbols_day: symbolsDay,
    symbols_night: symbolsNight,
    unique_files: uniqueFileCount
  };
}

function displayIconSetInfo(info) {
  // Check if the target elements are present
  const elVersion = document.getElementById('statistics-version');
  if (!elVersion) {
    // DOM not yet available → remember and show later
    pendingIconSetInfo = info;
    return;
  }

  if (!info) {
    elVersion.textContent = '—';
    document.getElementById('statistics-format').textContent = '—';
    document.getElementById('statistics-total_symbols').textContent = '—';
    document.getElementById('statistics-symbols_day').textContent = '—';
    document.getElementById('statistics-symbols_night').textContent = '—';
    document.getElementById('statistics-unique_files').textContent = '—';
    return;
  }
  elVersion.textContent = info.version;
  document.getElementById('statistics-format').textContent = info.format;
  document.getElementById('statistics-total_symbols').textContent = info.total_symbols;
  document.getElementById('statistics-symbols_day').textContent = info.symbols_day;
  document.getElementById('statistics-symbols_night').textContent = info.symbols_night;
  document.getElementById('statistics-unique_files').textContent = info.unique_files;
}

// ---------------------------------------------------------------------------
// Load icon mapping
// ---------------------------------------------------------------------------

async function loadIconMapping(iconset) {
  try {
    const resp = await fetch(pluginBase + '/icons/' + iconset + '/icon_mapping.json');
    if (resp.ok) {
      iconMapping = await resp.json();
      return true;
    }
  } catch (e) {}
  iconMapping = null;
  return false;
}

async function loadIconMappingAndUpdate(iconset) {
  const ok = await loadIconMapping(iconset);
  if (ok && iconMapping) {
    // compute + display
    const info = await computeIconSetInfo(iconMapping);
    pendingIconSetInfo = info;
  } else {
    pendingIconSetInfo = null;
  }
}

// ---------------------------------------------------------------------------
// Icon building
// ---------------------------------------------------------------------------

function buildIconPath(filename) {
  return iconsetPath + filename;
}

function phaseFilename(baseFilename, phaseIdx, pchar, ext) {
  const base = baseFilename.slice(0, -ext.length);
  return base + '_' + phaseIdx + pchar + ext;
}

function makeIcon(filename, tooltipLines) {
  const wrapper = document.createElement('div');
  wrapper.className = 'icon-wrapper';
  wrapper.style.background = bgColor;
  wrapper.style.setProperty('--icon-size', iconSize + 'px');

  const tooltip = document.createElement('div');
  tooltip.className = 'tooltip';
  tooltip.innerHTML = tooltipLines.join('<br>');
  wrapper.appendChild(tooltip);

  const img = document.createElement('img');
  img.width = iconSize;
  img.height = iconSize;
  img.style.width = iconSize + 'px';
  img.style.height = iconSize + 'px';
  img.src = buildIconPath(filename);
  img.alt = filename;
  img.onerror = function() {
    console.warn('Icon not found:', img.src);
    img.onerror = null; // prevent to call handler multiple times
    const missing = document.createElement('div');
    missing.className = 'icon-missing';
    missing.style.width = iconSize + 'px';
    missing.style.height = iconSize + 'px';
    missing.textContent = '?';
    wrapper.replaceChild(missing, img);
  };
  wrapper.appendChild(img);

  return wrapper;
}

function renderIconContainer(code) {
  const container = document.createElement('div');
  container.className = 'icon-cell';

  if (!iconMapping) {
    container.textContent = '–';
    return container;
  }

  const ext = '.' + (iconMapping.format || 'png');
  const codeEntry = iconMapping.icons && iconMapping.icons[code];

  if (!codeEntry) {
    container.textContent = '–';
    return container;
  }

  // Day icon
  if (codeEntry.icon_day) {
    const tooltip = [
      '<b>' + t('hover_day') + '</b>',
      t('hover_filename') + ': ' + codeEntry.icon_day
    ];
    container.appendChild(makeIcon(codeEntry.icon_day, tooltip));
  }

  // Night icon(s)
  if (codeEntry.icon_night) {

    const moonPhases = codeEntry.moon_phases || 0;
    if (moonPhases > 0) {
      for (let i = 0; i < moonPhases; i++) {
        const pchar = moonPhases === 3 ? 'h' : 'q'; // 'h' for half phases, 'q' for quarter phases
        const phaseFile = phaseFilename(codeEntry.icon_night, i, pchar, ext);
        const tooltip = [
          '<b>' + t('hover_night') + '</b>',
          t('hover_moon_phase') + ': ' + tMoonPhase(i),
          t('hover_filename') + ': ' + phaseFile
        ];
        container.appendChild(makeIcon(phaseFile, tooltip));
      }
    } else {
      const tooltip = [
        '<b>' + t('hover_night') + '</b>',
        t('hover_filename') + ': ' + codeEntry.icon_night
      ];
      container.appendChild(makeIcon(codeEntry.icon_night, tooltip));
    }
  }

  return container;
}

function renderIconCell(code) {
  const cell = document.createElement('td');
  cell.className = 'col-icon';
  cell.appendChild(renderIconContainer(code));
  return cell;
}

// ---------------------------------------------------------------------------
// Table building with responsive collapse support
// ---------------------------------------------------------------------------

function buildTable(codes) {
  const table = document.createElement('table');
  table.className = 'codes-table';

  const thead = document.createElement('thead');
  thead.innerHTML = `<tr>
    <th class="col-expand" aria-hidden="true"></th>
    <th class="col-num">${t('col_no')}</th>
    <th class="col-code">${t('col_code')}</th>
    <th class="col-desc">${t('col_description')}</th>
    <th class="col-icon">${t('col_icon_day')} / ${t('col_icon_night')}</th>
    <th class="col-remarks">${t('col_remarks')}</th>
  </tr>`;
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const byNr = {};
  WEATHER_CODES.forEach(function(row) { byNr[row[0]] = row; });

  codes.forEach(function(nr) {
    const row = byNr[nr];
    if (!row) return;
    const [rowNr, code, remarksKey] = row;

    // Main row
    const tr = document.createElement('tr');

    // Expand control cell (visible only on small screens)
    const tdExpand = document.createElement('td');
    tdExpand.className = 'col-expand';
    const btn = document.createElement('button');
    btn.className = 'expand-btn';
    btn.type = 'button';
    btn.setAttribute('aria-expanded', 'false');
    btn.title = 'Details anzeigen';
    btn.textContent = '+';
    tdExpand.appendChild(btn);

    const tdNr = document.createElement('td');
    tdNr.className = 'col-nr';
    tdNr.textContent = rowNr;

    const tdCode = document.createElement('td');
    tdCode.className = 'col-code code';
    tdCode.textContent = code;

    const tdDesc = document.createElement('td');
    tdDesc.className = 'col-desc desc';
    tdDesc.textContent = tDesc(code);

    const tdIcon = renderIconCell(code);

    const tdRemarks = document.createElement('td');
    tdRemarks.className = 'col-remarks remarks';
    tdRemarks.textContent = tRemark(code);
    if (remarksKey === 'forecast') {
      tdRemarks.textContent += ' (' + t('context_forecast') + ')';
    } else if (remarksKey === 'current') {
      tdRemarks.textContent += ' (' + t('context_current') + ')';
    } else {
      tdRemarks.textContent += ' (' + t('context_both') + ')';
    }

    tr.appendChild(tdExpand);
    tr.appendChild(tdNr);
    tr.appendChild(tdCode);
    tr.appendChild(tdDesc);
    tr.appendChild(tdIcon);
    tr.appendChild(tdRemarks);

    tbody.appendChild(tr);

    // Details row (hidden by default) that will be shown on small screens when user toggles
    const trDetails = document.createElement('tr');
    trDetails.className = 'row-details';
    const tdDetails = document.createElement('td');
    tdDetails.colSpan = 6;

    // Compose content: description, icons, remarks
    const detailsContainer = document.createElement('div');
    detailsContainer.style.display = 'flex';
    detailsContainer.style.flexWrap = 'wrap';
    detailsContainer.style.gap = '0.75rem';
    detailsContainer.style.alignItems = 'center';

    const descDiv = document.createElement('div');
    descDiv.style.flex = '1 1 200px';
    descDiv.innerHTML = `<strong>${t('col_description')}:</strong><div>${tDesc(code)}</div>`;

    const iconsDiv = document.createElement('div');
    iconsDiv.style.flex = '0 0 auto';
    iconsDiv.innerHTML = `<strong>${t('col_icon_day')} / ${t('col_icon_night')}:</strong>`;
    iconsDiv.appendChild(renderIconContainer(code));

    const remarksDiv = document.createElement('div');
    remarksDiv.style.flex = '1 1 200px';
    remarksDiv.innerHTML = `<strong>${t('col_remarks')}:</strong><div>${tRemark(code)}${(remarksKey === 'forecast' ? ' (' + t('context_forecast') + ')' : (remarksKey === 'current' ? ' (' + t('context_current') + ')' : ' (' + t('context_both') + ')'))}</div>`;

    detailsContainer.appendChild(descDiv);
    detailsContainer.appendChild(iconsDiv);
    detailsContainer.appendChild(remarksDiv);

    tdDetails.appendChild(detailsContainer);
    trDetails.appendChild(tdDetails);
    tbody.appendChild(trDetails);

    // Toggle behavior
    btn.addEventListener('click', function() {
      const expanded = this.getAttribute('aria-expanded') === 'true';
      this.setAttribute('aria-expanded', expanded ? 'false' : 'true');
      this.textContent = expanded ? '+' : '−';
      trDetails.style.display = expanded ? 'none' : 'table-row';
    });
  });

  table.appendChild(tbody);
  return table;
}

function buildStatisticsRow(label, value) {
  const tr = document.createElement('tr');

  const tdLabel = document.createElement('td');
  tdLabel.className = 'col-code code';
  tdLabel.textContent = `${t('label_' + label)}`;

  const tdValue = document.createElement('td');
  tdValue.className = 'col-desc desc';
  tdValue.id = 'statistics-' + label;
  tdValue.textContent = value;

  tr.appendChild(tdLabel);
  tr.appendChild(tdValue);
  return tr;
}

function buildStatisticsTable() {
  const table = document.createElement('table');
  table.className = 'codes-table';

  const thead = document.createElement('thead');
  thead.innerHTML = `<tr>
    <th class="col-expand" aria-hidden="true"></th>
    <th class="col-code">${t('col_params')}</th>
    <th class="col-desc">${t('col_values')}</th>
  </tr>`;
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
 
  tbody.appendChild(buildStatisticsRow('version', '-'));
  tbody.appendChild(buildStatisticsRow('format', '-'));
  tbody.appendChild(buildStatisticsRow('total_symbols', '-'));
  tbody.appendChild(buildStatisticsRow('symbols_day', '-'));
  tbody.appendChild(buildStatisticsRow('symbols_night', '-'));
  tbody.appendChild(buildStatisticsRow('unique_files', '-'));

  table.appendChild(tbody);
  return table;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------

function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';

  const byNr = {};
  WEATHER_CODES.forEach(function(row) { byNr[row[0]] = row; });

  CATEGORIES.forEach(function(cat) {
    const section = document.createElement('div');
    section.className = 'category-section';

    const h2 = document.createElement('h2');
    h2.textContent = tCategory(cat.key);
    section.appendChild(h2);

    if (cat.codes.length > 0) {
      section.appendChild(buildTable(cat.codes));
    } else {
      section.appendChild(buildStatisticsTable());
    }
    content.appendChild(section);
  });

   // If Iconset info is available, display it now
  if (pendingIconSetInfo) {
    displayIconSetInfo(pendingIconSetInfo);
  }

  // After render, ensure icons have correct size/background
  updateIconSizes();
  updateBgColors();
}

function applyTranslations() {
  document.getElementById('hdr-title').textContent = '☁️ ' + t('weathercodes_title');
  document.getElementById('hdr-subtitle').textContent = t('weathercodes_subtitle');
  document.getElementById('lbl-iconset').textContent = t('label_iconset') + ':';
  document.getElementById('lbl-bg').textContent = t('label_background') + ':';
  document.getElementById('lbl-size').textContent = t('label_icon_size') + ':';
  document.getElementById('lbl-lang').textContent = t('label_language') + ':';

  // Translate background options
  const bgSel = document.getElementById('bg-select');
  Array.from(bgSel.options).forEach(function(opt) {
    const key = opt.getAttribute('data-key');
    if (key && lang[key]) opt.text = lang[key];
  });
}

function updateIconSizes() {
    // set icon size variable and adjust values
  document.documentElement.style.setProperty('--icon-size', iconSize + 'px');
  document.querySelectorAll('.icon-wrapper').forEach(function(wrapper) {
    wrapper.style.setProperty('--icon-size', iconSize + 'px');
  });
  document.querySelectorAll('.icon-wrapper img').forEach(function(img) {
    img.style.width = iconSize + 'px';
    img.style.height = iconSize + 'px';
    img.width = iconSize;
    img.height = iconSize;
  });
  document.querySelectorAll('.icon-missing').forEach(function(el) {
    el.style.width = iconSize + 'px';
    el.style.height = iconSize + 'px';
  });
  document.getElementById('size-display').textContent = iconSize + 'px';
}

function updateBgColors() {
  document.querySelectorAll('.icon-wrapper').forEach(function(el) {
    el.style.background = bgColor;
  });
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------

async function init() {

  // Set UI from URL params
  const iconsetSel = document.getElementById('iconset-select');
  iconsetSel.value = urlIconset;
  if (!iconsetSel.value) iconsetSel.value = 'naturalistic';

  const langSel = document.getElementById('lang-select');
  langSel.value = urlLang;
  if (!langSel.value) langSel.value = 'en';

  // If a "size" parameter was present in the URL, use it as initial icon size
  if (urlSize !== null) {
    iconSize = urlSize;
    const slider = document.getElementById('size-slider');
    slider.value = iconSize;
    document.getElementById('size-display').textContent = iconSize + 'px';
  }

  // Load language
  await loadLang(langSel.value);
  applyTranslations();

  // Load icon mapping
  const currentIconset = iconsetSel.value;
  iconsetPath = pluginBase + '/icons/' + currentIconset + '/';
  await loadIconMappingAndUpdate(currentIconset);

  render();

  // Event listeners
  iconsetSel.addEventListener('change', async function() {
    pendingIconSetInfo = null;
    const sel = this.value;
    iconsetPath = pluginBase + '/icons/' + sel + '/';
    await loadIconMappingAndUpdate(sel);
    render();
  });

  document.getElementById('bg-select').addEventListener('change', function() {
    bgColor = this.value;
    updateBgColors();
  });

  document.getElementById('size-slider').addEventListener('input', function() {
    iconSize = parseInt(this.value, 10);
    updateIconSizes();
  });

  langSel.addEventListener('change', async function() {
    await loadLang(this.value);
    applyTranslations();
    render();
  });

  // Accessibility: close any details rows when window is resized larger than collapse breakpoints
  window.addEventListener('resize', function() {
    // If columns are visible the details rows should be hidden
    const showDetails = window.matchMedia('(max-width: 600px)').matches || window.matchMedia('(max-width: 900px)').matches;
    document.querySelectorAll('.row-details').forEach(function(r) {
      r.style.display = 'none';
    });
    document.querySelectorAll('.expand-btn').forEach(function(b) {
      b.setAttribute('aria-expanded', 'false');
      b.textContent = '+';
    });
  });
}

init();
</script>

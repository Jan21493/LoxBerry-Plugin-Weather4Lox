<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather4Lox Codes</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: #333;
      min-height: 100vh;
    }

    header {
      background: #1a3a5c;
      color: #fff;
      padding: 1rem 2rem;
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
    }

    header p {
      font-size: 0.9rem;
      opacity: 0.75;
    }

    .controls {
      background: #fff;
      border-bottom: 1px solid #dde8f4;
      padding: 0.75rem 2rem;
      display: flex;
      align-items: center;
      gap: 1.5rem;
      flex-wrap: wrap;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.88rem;
    }

    .control-group label {
      font-weight: 600;
      white-space: nowrap;
      color: #1a3a5c;
    }

    .control-group select {
      padding: 0.3rem 0.5rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.88rem;
      background: #fff;
    }

    .control-group input[type=range] {
      width: 120px;
    }

    .size-display {
      font-size: 0.8rem;
      color: #666;
      min-width: 3rem;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
    }

    .category-section {
      margin-bottom: 2rem;
    }

    .category-section h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #1a3a5c;
      padding: 0.6rem 1rem;
      background: #dde8f4;
      border-left: 4px solid #1a3a5c;
      border-radius: 0 6px 6px 0;
      margin-bottom: 0.5rem;
    }

    .codes-table {
      width: 100%;
      border-collapse: collapse;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      font-size: 0.88rem;
    }

    .codes-table thead th {
      background: #f0f4f8;
      padding: 0.65rem 0.75rem;
      text-align: left;
      font-weight: 600;
      border-bottom: 2px solid #dde8f4;
      white-space: nowrap;
    }

    .codes-table tbody tr:nth-child(even) { background: #fafbfc; }
    .codes-table tbody tr:hover { background: #edf4ff; }

    .codes-table td {
      padding: 0.55rem 0.75rem;
      vertical-align: middle;
      border-bottom: 1px solid #eee;
    }

    .codes-table td.nr { width: 2.5rem; text-align: center; color: #888; font-size: 0.8rem; }
    .codes-table td.code { font-family: monospace; font-size: 0.82rem; color: #0d4a8a; white-space: nowrap; }
    .codes-table td.desc { color: #444; }
    .codes-table td.ctx { font-size: 0.78rem; color: #666; white-space: nowrap; }

    .icon-cell {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .icon-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      border-radius: 4px;
      cursor: default;
    }

    .icon-wrapper img {
      display: block;
      object-fit: contain;
    }

    .icon-missing {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #f0f0f0;
      border: 1px dashed #ccc;
      border-radius: 4px;
      color: #bbb;
      font-size: 0.6rem;
      text-align: center;
    }

    /* Custom tooltip */
    .icon-wrapper .tooltip {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20,40,70,0.95);
      color: #fff;
      padding: 0.4rem 0.6rem;
      border-radius: 5px;
      font-size: 0.72rem;
      white-space: nowrap;
      z-index: 100;
      pointer-events: none;
      line-height: 1.5;
      margin-bottom: 4px;
    }

    .icon-wrapper .tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 5px solid transparent;
      border-top-color: rgba(20,40,70,0.95);
    }

    .icon-wrapper:hover .tooltip {
      display: block;
    }

    @media (max-width: 768px) {
      .codes-table { font-size: 0.78rem; }
      .codes-table td { padding: 0.4rem 0.5rem; }
      .controls { padding: 0.5rem 1rem; gap: 1rem; }
    }
  </style>
</head>
<body>

<header>
  <h1 id="hdr-title">☁️ Weather4Lox Codes</h1>
  <p id="hdr-subtitle">Weather Code Reference</p>
</header>

<div class="controls">
  <div class="control-group">
    <label id="lbl-iconset">Icon Set:</label>
    <select id="iconset-select">
      <option value="naturalistic">naturalistic</option>
      <option value="color">color</option>
      <option value="custom">custom</option>
      <option value="dark">dark</option>
      <option value="flat">flat</option>
      <option value="green">green</option>
      <option value="light">light</option>
      <option value="realistic">realistic</option>
      <option value="silver">silver</option>
      <option value="svg">svg</option>
    </select>
  </div>
  <div class="control-group">
    <label id="lbl-bg">Background:</label>
    <select id="bg-select">
      <option value="#ffffff" data-key="bg_white">White</option>
      <option value="#e0e0e0" data-key="bg_light_gray">Light Gray</option>
      <option value="#404040" data-key="bg_dark_gray">Dark Gray</option>
      <option value="#000000" data-key="bg_black">Black</option>
      <option value="#1565c0" data-key="bg_blue">Blue</option>
    </select>
  </div>
  <div class="control-group">
    <label id="lbl-size">Icon Size:</label>
    <input type="range" id="size-slider" min="32" max="256" value="48" step="8">
    <span class="size-display" id="size-display">48px</span>
  </div>
  <div class="control-group">
    <label id="lbl-lang">Language:</label>
    <select id="lang-select">
      <option value="en">English</option>
      <option value="de">Deutsch</option>
      <option value="nl">Nederlands</option>
      <option value="es">Español</option>
      <option value="sk">Slovenčina</option>
    </select>
  </div>
</div>

<div class="container">
  <div id="content"></div>
</div>

<script>
// ---------------------------------------------------------------------------
// Weather code definitions (45 codes)
// ---------------------------------------------------------------------------

const WEATHER_CODES = [
  // [nr, code, context_key]
  // Cloud Cover
  [1,  'clear',                      'both'],
  [2,  'fair',                       'both'],
  [3,  'cloudy',                     'both'],
  [4,  'overcast',                   'both'],
  // Showers
  [5,  'cloudy_shower_1',            'forecast'],
  [6,  'cloudy_shower_2',            'forecast'],
  [7,  'overcast_shower_1',          'both'],
  [8,  'overcast_shower_2',          'both'],
  [9,  'overcast_shower_3',          'both'],
  // Rain
  [10, 'cloudy_rain_1',              'forecast'],
  [11, 'cloudy_rain_2',              'forecast'],
  [12, 'overcast_rain_1',            'both'],
  [13, 'overcast_rain_2',            'both'],
  [14, 'overcast_rain_3',            'both'],
  // Sleet
  [15, 'cloudy_sleet_1',             'forecast'],
  [16, 'cloudy_sleet_2',             'forecast'],
  [17, 'overcast_sleet_1',           'both'],
  [18, 'overcast_sleet_2',           'both'],
  [19, 'overcast_sleet_3',           'both'],
  // Snow
  [20, 'cloudy_snow_1',              'forecast'],
  [21, 'cloudy_snow_2',              'forecast'],
  [22, 'overcast_snow_1',            'both'],
  [23, 'overcast_snow_2',            'both'],
  [24, 'overcast_snow_3',            'both'],
  // Freezing Rain
  [25, 'cloudy_freezingrain_1',      'forecast'],
  [26, 'cloudy_freezingrain_2',      'forecast'],
  [27, 'overcast_freezingrain_1',    'both'],
  [28, 'overcast_freezingrain_2',    'both'],
  [29, 'overcast_freezingrain_3',    'both'],
  // Thunderstorm
  [30, 'cloudy_thunderstorm_1',      'forecast'],
  [31, 'cloudy_thunderstorm_2',      'forecast'],
  [32, 'overcast_thunderstorm_1',    'both'],
  [33, 'overcast_thunderstorm_2',    'both'],
  [34, 'overcast_thunderstorm_3',    'both'],
  // Snow Thunderstorm
  [35, 'cloudy_snowthunderstorm_1',  'forecast'],
  [36, 'cloudy_snowthunderstorm_2',  'forecast'],
  [37, 'overcast_snowthunderstorm_1','both'],
  [38, 'overcast_snowthunderstorm_2','both'],
  [39, 'overcast_snowthunderstorm_3','both'],
  // Fog
  [40, 'cloudy_fog',                 'both'],
  [41, 'overcast_fog',               'both'],
  // Hail
  [42, 'overcast_hail_1',            'both'],
  [43, 'overcast_hail_2',            'both'],
  [44, 'overcast_hail_3',            'both'],
  // Special
  [45, 'no_data',                    'both'],
];

const CATEGORIES = [
  { key: '☁️ Cloud Cover',        codes: [1, 2, 3, 4] },
  { key: '🌦️ Showers',            codes: [5, 6, 7, 8, 9] },
  { key: '🌧️ Rain',                codes: [10, 11, 12, 13, 14] },
  { key: '🌨️ Sleet',               codes: [15, 16, 17, 18, 19] },
  { key: '❄️ Snow',                codes: [20, 21, 22, 23, 24] },
  { key: '🌧️ Freezing Rain',       codes: [25, 26, 27, 28, 29] },
  { key: '⛈️ Thunderstorm',        codes: [30, 31, 32, 33, 34] },
  { key: '⛈️ Snow Thunderstorm',   codes: [35, 36, 37, 38, 39] },
  { key: '🌫️ Fog',                 codes: [40, 41] },
  { key: '🌨️ Hail',                codes: [42, 43, 44] },
  { key: '❓ Special',             codes: [45] },
];

// ---------------------------------------------------------------------------
// State
// ---------------------------------------------------------------------------

let lang = {};
let iconMapping = null;
let iconSize = 48;
let iconsetPath = '';
let bgColor = '#ffffff';

// ---------------------------------------------------------------------------
// Plugin base path detection
// ---------------------------------------------------------------------------

function getPluginBase() {
  const pathParts = window.location.pathname.split('/');
  const pluginsIdx = pathParts.indexOf('plugins');
  if (pluginsIdx !== -1 && pathParts[pluginsIdx + 1]) {
    return '/plugins/' + pathParts[pluginsIdx + 1];
  }
  return '';
}

const pluginBase = getPluginBase();

// ---------------------------------------------------------------------------
// URL parameters
// ---------------------------------------------------------------------------

const urlParams = new URLSearchParams(window.location.search);

// Sanitize: only allow alphanumeric chars (plus hyphen/underscore) to prevent path traversal
function sanitizeParam(val, fallback) {
  if (!val) return fallback;
  return /^[a-zA-Z0-9_-]+$/.test(val) ? val : fallback;
}

const urlLang = sanitizeParam((urlParams.get('lang') || 'en').toLowerCase(), 'en');
const urlIconset = sanitizeParam(urlParams.get('iconset'), 'naturalistic');

// ---------------------------------------------------------------------------
// Load language JSON
// ---------------------------------------------------------------------------

async function loadLang(langCode) {
  const supported = ['en', 'de', 'nl', 'es', 'sk'];
  const code = supported.includes(langCode) ? langCode : 'en';
  try {
    const resp = await fetch(pluginBase + '/lang-' + code + '.json');
    if (resp.ok) {
      lang = await resp.json();
    }
  } catch (e) {
    lang = {};
  }
}

function t(key) {
  return lang[key] || key;
}

function tDesc(code) {
  if (lang.weather_descriptions && lang.weather_descriptions[code]) {
    return lang.weather_descriptions[code];
  }
  return code;
}

function tMoonPhase(phaseIdx) {
  const key = 'moon_phase_' + phaseIdx;
  return lang[key] || ('Phase ' + phaseIdx);
}

// ---------------------------------------------------------------------------
// Load icon mapping
// ---------------------------------------------------------------------------

async function loadIconMapping(iconset) {
  try {
    const resp = await fetch(pluginBase + '/icons/' + iconset + '/icon_mapping.json');
    if (resp.ok) {
      iconMapping = await resp.json();
      return true;
    }
  } catch (e) {}
  iconMapping = null;
  return false;
}

// ---------------------------------------------------------------------------
// Icon building
// ---------------------------------------------------------------------------

function buildIconPath(filename) {
  return iconsetPath + filename;
}

function phaseFilename(baseFilename, phaseIdx, ext) {
  // e.g. "clear_moon.png" + phase 0 → "clear_moon_0q.png"
  const base = baseFilename.slice(0, -ext.length);
  return base + '_' + phaseIdx + 'q' + ext;
}

function makeIcon(filename, tooltipLines) {
  const wrapper = document.createElement('div');
  wrapper.className = 'icon-wrapper';
  wrapper.style.background = bgColor;

  // Tooltip
  const tooltip = document.createElement('div');
  tooltip.className = 'tooltip';
  tooltip.innerHTML = tooltipLines.join('<br>');
  wrapper.appendChild(tooltip);

  const img = document.createElement('img');
  img.width = iconSize;
  img.height = iconSize;
  img.style.width = iconSize + 'px';
  img.style.height = iconSize + 'px';
  img.src = buildIconPath(filename);
  img.alt = filename;
  img.onerror = function() {
    const missing = document.createElement('div');
    missing.className = 'icon-missing';
    missing.style.width = iconSize + 'px';
    missing.style.height = iconSize + 'px';
    missing.textContent = '?';
    wrapper.replaceChild(missing, img);
  };
  wrapper.appendChild(img);

  return wrapper;
}

function renderIconCell(code) {
  const cell = document.createElement('td');
  cell.className = 'icon-cell-td';

  const container = document.createElement('div');
  container.className = 'icon-cell';
  cell.appendChild(container);

  if (!iconMapping) {
    container.textContent = '–';
    return cell;
  }

  const ext = '.' + (iconMapping.format || 'png');
  const moonPhases = iconMapping.moon_phases || 0;
  const codeEntry = iconMapping.icons && iconMapping.icons[code];

  if (!codeEntry) {
    container.textContent = '–';
    return cell;
  }

  // Day icon
  if (codeEntry.icon_day) {
    const tooltip = [
      '<b>' + t('hover_day') + '</b>',
      t('hover_filename') + ': ' + codeEntry.icon_day
    ];
    container.appendChild(makeIcon(codeEntry.icon_day, tooltip));
  }

  // Night icon(s)
  if (codeEntry.icon_night) {
    if (moonPhases > 0) {
      // Show phase variants
      for (let i = 0; i < moonPhases; i++) {
        const phaseFile = phaseFilename(codeEntry.icon_night, i, ext);
        const tooltip = [
          '<b>' + t('hover_night') + '</b>',
          t('hover_moon_phase') + ': ' + tMoonPhase(i),
          t('hover_filename') + ': ' + phaseFile
        ];
        container.appendChild(makeIcon(phaseFile, tooltip));
      }
    } else {
      // Single night icon
      const tooltip = [
        '<b>' + t('hover_night') + '</b>',
        t('hover_filename') + ': ' + codeEntry.icon_night
      ];
      container.appendChild(makeIcon(codeEntry.icon_night, tooltip));
    }
  }

  return cell;
}

// ---------------------------------------------------------------------------
// Table building
// ---------------------------------------------------------------------------

function buildTable(codes) {
  const table = document.createElement('table');
  table.className = 'codes-table';

  const thead = document.createElement('thead');
  thead.innerHTML = `<tr>
    <th class="nr">Nr</th>
    <th>${t('col_code')}</th>
    <th>${t('col_description')}</th>
    <th>${t('col_icon_day')} / ${t('col_icon_night')}</th>
    <th>${t('col_context')}</th>
  </tr>`;
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  const byNr = {};
  WEATHER_CODES.forEach(function(row) { byNr[row[0]] = row; });

  codes.forEach(function(nr) {
    const row = byNr[nr];
    if (!row) return;
    const [rowNr, code, ctxKey] = row;

    const tr = document.createElement('tr');

    const tdNr = document.createElement('td');
    tdNr.className = 'nr';
    tdNr.textContent = rowNr;

    const tdCode = document.createElement('td');
    tdCode.className = 'code';
    tdCode.textContent = code;

    const tdDesc = document.createElement('td');
    tdDesc.className = 'desc';
    tdDesc.textContent = tDesc(code);

    const tdIcon = renderIconCell(code);

    const tdCtx = document.createElement('td');
    tdCtx.className = 'ctx';
    if (ctxKey === 'forecast') {
      tdCtx.textContent = t('context_forecast');
    } else if (ctxKey === 'current') {
      tdCtx.textContent = t('context_current');
    } else {
      tdCtx.textContent = t('context_both');
    }

    tr.appendChild(tdNr);
    tr.appendChild(tdCode);
    tr.appendChild(tdDesc);
    tr.appendChild(tdIcon);
    tr.appendChild(tdCtx);

    tbody.appendChild(tr);
  });

  table.appendChild(tbody);
  return table;
}

// ---------------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------------

function render() {
  const content = document.getElementById('content');
  content.innerHTML = '';

  const byNr = {};
  WEATHER_CODES.forEach(function(row) { byNr[row[0]] = row; });

  CATEGORIES.forEach(function(cat) {
    const section = document.createElement('div');
    section.className = 'category-section';

    const h2 = document.createElement('h2');
    h2.textContent = cat.key;
    section.appendChild(h2);

    section.appendChild(buildTable(cat.codes));
    content.appendChild(section);
  });
}

function applyTranslations() {
  document.getElementById('hdr-title').textContent = '☁️ ' + t('weathercodes_title');
  document.getElementById('hdr-subtitle').textContent = t('weathercodes_subtitle');
  document.getElementById('lbl-iconset').textContent = t('label_iconset') + ':';
  document.getElementById('lbl-bg').textContent = t('label_background') + ':';
  document.getElementById('lbl-size').textContent = t('label_icon_size') + ':';
  document.getElementById('lbl-lang').textContent = t('label_language') + ':';

  // Translate background options
  const bgSel = document.getElementById('bg-select');
  Array.from(bgSel.options).forEach(function(opt) {
    const key = opt.getAttribute('data-key');
    if (key && lang[key]) opt.text = lang[key];
  });
}

function updateIconSizes() {
  document.querySelectorAll('.icon-wrapper img').forEach(function(img) {
    img.style.width = iconSize + 'px';
    img.style.height = iconSize + 'px';
    img.width = iconSize;
    img.height = iconSize;
  });
  document.querySelectorAll('.icon-missing').forEach(function(el) {
    el.style.width = iconSize + 'px';
    el.style.height = iconSize + 'px';
  });
  document.getElementById('size-display').textContent = iconSize + 'px';
}

function updateBgColors() {
  document.querySelectorAll('.icon-wrapper').forEach(function(el) {
    el.style.background = bgColor;
  });
}

// ---------------------------------------------------------------------------
// Init
// ---------------------------------------------------------------------------

async function init() {
  // Set UI from URL params
  const iconsetSel = document.getElementById('iconset-select');
  iconsetSel.value = urlIconset;
  if (!iconsetSel.value) iconsetSel.value = 'naturalistic';

  const langSel = document.getElementById('lang-select');
  langSel.value = urlLang;
  if (!langSel.value) langSel.value = 'en';

  // Load language
  await loadLang(langSel.value);
  applyTranslations();

  // Load icon mapping
  const currentIconset = iconsetSel.value;
  iconsetPath = pluginBase + '/icons/' + currentIconset + '/';
  await loadIconMapping(currentIconset);

  render();

  // Event listeners
  iconsetSel.addEventListener('change', async function() {
    const sel = this.value;
    iconsetPath = pluginBase + '/icons/' + sel + '/';
    await loadIconMapping(sel);
    render();
  });

  document.getElementById('bg-select').addEventListener('change', function() {
    bgColor = this.value;
    updateBgColors();
  });

  document.getElementById('size-slider').addEventListener('input', function() {
    iconSize = parseInt(this.value, 10);
    updateIconSizes();
  });

  langSel.addEventListener('change', async function() {
    await loadLang(this.value);
    applyTranslations();
    render();
  });
}

init();
</script>
</body>
</html>
